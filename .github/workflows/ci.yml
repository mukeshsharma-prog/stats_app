name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Schema and Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/schemas/requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install schema validator dependencies
        run: python -m pip install --requirement docs/schemas/requirements.txt

      - name: Validate JSON Schema fixtures
        run: python docs/schemas/validate-fixtures.py

      - name: Verify OpenAPI schema parity
        run: |
          python docs/contracts/test_schema_drift.py
          python docs/contracts/check_schema_drift.py

      - name: Validate DLQ alert rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            --volume "$PWD/ops/prometheus:/work:ro" \
            --workdir /work \
            prom/prometheus:v3.5.0 \
            check rules dlq-alerts.yml
          docker run --rm \
            --entrypoint promtool \
            --volume "$PWD/ops/prometheus:/work:ro" \
            --workdir /work \
            prom/prometheus:v3.5.0 \
            test rules dlq-alerts.test.yml

      # DL-117. Catches OpenAPI defects a YAML parse cannot see — an unquoted
      # description containing a comma silently becomes an extra schema key.
      # Version pinned: an unpinned linter can start failing CI on a release we
      # did not make. Rules and the two deliberate suppressions: redocly.yaml.
      - name: Lint OpenAPI contracts
        run: npx --yes @redocly/cli@2.51.2 lint

      # DL-145. Both contracts rendered onto one reviewable page — the document ZC
      # confirms or declines. Not committed (DL-117: a checked-in bundle goes stale);
      # built here so a reviewer without Node downloads it from the run instead.
      - name: Render contracts HTML
        run: docs/contracts/build-html.sh

      - name: Upload contracts HTML
        uses: actions/upload-artifact@v4
        with:
          name: stats-api-v1-draft
          path: stats-api-v1-draft.html
          if-no-files-found: error

      - name: Build and test
        run: ./gradlew build --no-daemon
