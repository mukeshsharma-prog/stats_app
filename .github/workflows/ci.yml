name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Schema and Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/schemas/requirements.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install schema validator dependencies
        run: python -m pip install --requirement docs/schemas/requirements.txt

      - name: Validate JSON Schema fixtures
        run: python docs/schemas/validate-fixtures.py

      - name: Build and test
        run: ./gradlew build --no-daemon
