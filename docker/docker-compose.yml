# Stats App — local development stack.
#
#   docker compose up -d                       infrastructure only (the default)
#   docker compose --profile apps up -d        infrastructure + all three modules + monitoring
#
# The default is infrastructure only, because the documented development loop
# (claude/DEVELOPMENT.md §3.3) runs the modules with ./gradlew bootRun so you get
# a debugger and hot restart. The `apps` profile is for end-to-end checks and for
# anyone who wants the whole system with one command. Prometheus and the
# PostgreSQL exporter start with that profile and share its project network.
#
# RabbitMQ, PostgreSQL and Keycloak are INFRASTRUCTURE DEPENDENCIES, not Stats App
# deployables (CLAUDE.md §1). Only the three services under the `apps` profile are
# ours to ship.
#
# All values come from the repository-root .env. This file contains no ${...}
# interpolation on purpose: env_file paths resolve relative to this file, so the
# stack behaves identically no matter which directory you run compose from.

name: stats-app

services:

  # === PostgreSQL — the only V1 persistence technology (CLAUDE.md §3) =========
  postgres:
    image: postgres:17-alpine
    container_name: stats-postgres
    restart: unless-stopped
    env_file: ../.env
    # Continuous WAL archiving — the RPO <= 5 min half of ADR-003 D5 (DL-111, T-051,
    # DL-155). archive_timeout=300 ships a segment at least every five minutes even when
    # it is not full, which is what bounds the loss window. The archive lives on its own
    # volume so `docker compose down -v` of the data volume does not take it too.
    #
    # The entrypoint is wrapped for ONE reason: Docker creates a fresh named volume's
    # mount point as root, and an archive directory the postgres user cannot write to
    # makes every archive attempt fail while the database runs perfectly -- measured on
    # 21 Sep 2026: failed_count=7, archived_count=0, no symptom anywhere but
    # pg_stat_archiver. Own the directory first, then hand over to the stock entrypoint.
    entrypoint:
      - sh
      - -c
      - >-
        chown postgres:postgres /var/lib/postgresql/wal-archive
        && exec docker-entrypoint.sh "$@"
      - --
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-wal-archive:/var/lib/postgresql/wal-archive
      # Runs ONCE, on an empty data directory. Edit a script here and you must
      # `docker compose down -v` for it to run again.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Both -U and -d matter: without -d, pg_isready probes a database named
      # after the user, which does not exist here.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # === RabbitMQ ==============================================================
  # No queues, exchanges or bindings are declared here, deliberately. The topology
  # is declared by the modules from the shared constants in stats-common. Two
  # declarations of the same resource with different arguments is exactly the
  # RESOURCE_LOCKED failure CLAUDE.md §6 warns about, and a definitions file
  # committed here would be a second, silently drifting source of truth.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: stats-rabbitmq
    restart: unless-stopped
    env_file: ../.env
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # === Keycloak ==============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: stats-keycloak
    restart: unless-stopped
    # --import-realm reads /opt/keycloak/data/import at startup, and ONLY when the
    # realm does not already exist. Edit the realm JSON and restarting changes
    # nothing — you need `docker compose down -v` to drop Keycloak's H2 state.
    command: ["start-dev", "--import-realm"]
    # env_file supplies KC_BOOTSTRAP_ADMIN_* for the admin account and every
    # STATS_* value the realm JSON resolves as ${NAME:default}.
    env_file: ../.env
    environment:
      KC_HEALTH_ENABLED: "true"
      # localhost is the issuer, deliberately. The app services sit behind the
      # `apps` profile, so a plain `docker compose up` starts infrastructure only
      # and you run the modules from your IDE against the published port. For that
      # — the common path — localhost:8080 is what both the browser and the module
      # see, and no /etc/hosts edit is needed.
      #
      # KC_HOSTNAME fixes what goes in every token's `iss` claim. It does NOT have
      # to be reachable from inside the compose network, because a containerised
      # module validates `iss` as a string and fetches keys from a separate URL:
      # see KEYCLOAK_JWK_SET_URI on stats-api below. That split is what lets one
      # issuer value work from the host and from a container at the same time.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ../docs/setup/keycloak-realm-statsapp.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      # The Keycloak image ships no curl or wget. bash's /dev/tcp is the portable
      # way to probe the management port (9000) it serves /health/ready on.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # === Module 1 — Input: HTTP POST -> AMQP ===================================
  stats-input:
    profiles: ["apps", "observability"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: stats-input
    image: stats-app/stats-input:dev
    container_name: stats-input
    restart: unless-stopped
    env_file: ../.env
    environment:
      # env_file is shared for local convenience, but Input has no database role
      # (ADR-006). Empty overrides ensure no PostgreSQL endpoint or credential is
      # present in this container even though those keys exist in the source file.
      POSTGRES_URL: ""
      POSTGRES_DB: ""
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      POSTGRES_RO_USER: ""
      POSTGRES_RO_PASSWORD: ""
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # === Module 2 — Writer: AMQP -> PostgreSQL =================================
  # The only component with database write access (rule 2, STA-32).
  stats-writer:
    profiles: ["apps", "observability"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: stats-writer
    image: stats-app/stats-writer:dev
    container_name: stats-writer
    restart: unless-stopped
    # Longer than the listener's five-second grace, leaving time for Spring and the JVM
    # to close after RabbitMQ has requeued any delivery that could not finish safely.
    stop_grace_period: 10s
    env_file: ../.env
    environment:
      # Writer receives only its write-capable database identity, never the API
      # role's credential.
      POSTGRES_RO_USER: ""
      POSTGRES_RO_PASSWORD: ""
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # === Module 3 — API: read-only REST ========================================
  # No broker connection, deliberately — Q3a. Give this module a RabbitMQ
  # dependency and you have contradicted the open question, not answered it.
  stats-api:
    profiles: ["apps", "observability"]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        MODULE: stats-api
    image: stats-app/stats-api:dev
    container_name: stats-api
    restart: unless-stopped
    env_file: ../.env
    environment:
      # API connects as stats_ro. Do not leave the Writer identity available for
      # application code to read from its process environment.
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      # `iss` stays http://localhost:8080/realms/statsapp — it is validated as a
      # string, never fetched. But this container cannot reach the host's
      # localhost:8080 to download signing keys, so point the JWK set at the
      # compose-network hostname instead. Setting jwk-set-uri also disables OIDC
      # discovery, which is exactly what we want here: discovery would try to GET
      # the issuer URL and fail.
      #
      # In production, leave this unset — discovery from the real HTTPS issuer is
      # correct and one less thing to keep in sync.
      # Local metrics scraping only; /v1/** still requires the read role and tenant.
      STATS_SECURITY_PROMETHEUS_PUBLIC_ACCESS: "true"
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/statsapp/protocol/openid-connect/certs
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # === Acceptance tests — Postman collection through Newman =================
  # Run after the application profile is healthy:
  #   docker compose --profile apps --profile test run --rm postman-tests
  postman-tests:
    profiles: ["test"]
    image: postman/newman:alpine
    container_name: stats-postman-tests
    restart: "no"
    env_file: ../.env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        newman run /etc/newman/stats-app.postman_collection.json
        --environment /etc/newman/local.postman_environment.json
        --delay-request 500
        --reporters cli
        --env-var inputBaseUrl=http://stats-input:8081
        --env-var apiBaseUrl=http://stats-api:8083/v1
        --env-var apiRootUrl=http://stats-api:8083
        --env-var writerBaseUrl=http://stats-writer:8082
        --env-var rabbitBaseUrl=http://rabbitmq:15672
        --env-var tokenUrl=http://keycloak:8080/realms/statsapp/protocol/openid-connect/token
        --env-var devClientId="$${STATS_DEV_CLI_CLIENT_ID}"
        --env-var alphaReaderUsername="$${STATS_ALPHA_READER_USERNAME}"
        --env-var alphaReaderPassword="$${STATS_ALPHA_READER_PASSWORD}"
        --env-var noRoleUsername="$${STATS_NO_ROLE_USERNAME}"
        --env-var noRolePassword="$${STATS_NO_ROLE_PASSWORD}"
        --env-var noTenantUsername="$${STATS_NO_TENANT_USERNAME}"
        --env-var noTenantPassword="$${STATS_NO_TENANT_PASSWORD}"
        --env-var tenantAlpha="$${STATS_TENANT_A_ID}"
        --env-var rabbitUsername="$${RABBITMQ_USER}"
        --env-var rabbitPassword="$${RABBITMQ_PASSWORD}"
    volumes:
      - ../postman:/etc/newman:ro
    depends_on:
      stats-input:
        condition: service_healthy
      stats-writer:
        condition: service_healthy
      stats-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # === Hand-run tools — ./docker/shell.sh and ./docker/run-demo.sh (DL-171) =====
  # bash, curl, jq and a Docker CLI, plus docker/demo.sh and its fixtures, so the
  # walkthrough in MANUAL.md and the demo need nothing on the host but Docker. The
  # Docker socket is mounted because both are real: they read rows with
  # `docker exec psql`, read service logs, and the demo's step 10 STOPS RabbitMQ.
  stats-tools:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.tools
    image: stats-app/stats-tools:dev
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../.env:/bundle/.env:ro
    environment:
      STATS_TOOLS_CONTAINER: "true"
      STATS_ENV_FILE: /bundle/.env
      DEMO_ENV_FILE: /bundle/.env
      INPUT_BASE_URL: http://stats-input:8081
      WRITER_BASE_URL: http://stats-writer:8082
      API_BASE_URL: http://stats-api:8083
      # Tokens fetched here still carry iss=http://localhost:8080 — KC_HOSTNAME above
      # fixes the issuer whichever address the request arrives on.
      KEYCLOAK_BASE_URL: http://keycloak:8080
      RABBITMQ_API_URL: http://rabbitmq:15672
      DEMO_HOST_WRITER_METRICS_URL: http://localhost:8082/actuator/prometheus
    depends_on:
      stats-input:
        condition: service_healthy
      stats-writer:
        condition: service_healthy
      stats-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # === Monitoring — starts with applications =================================
  # The apps profile includes Prometheus and the PostgreSQL exporter. Dependencies
  # ensure all four scrape targets exist on this project's default network.
  # Grafana is optional: add --profile observability to enable its dashboards.
  postgres-exporter:
    profiles: ["apps", "observability"]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: stats-postgres-exporter
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATA_SOURCE_URI: postgres:5432/statsdb?sslmode=disable
    # The exporter reads pg_stat_* views only, so it gets the READ-ONLY identity -- and
    # it wants that identity under its own variable names. This file carries no ${...}
    # interpolation (see the header), so the rename happens inside the container: the
    # image is busybox-based and has sh.
    entrypoint:
      - sh
      - -c
      - >-
        export DATA_SOURCE_USER="$$POSTGRES_RO_USER" DATA_SOURCE_PASS="$$POSTGRES_RO_PASSWORD"
        && exec /bin/postgres_exporter "$@"
      - --
    command:
      # archive_mode is an enum, which the built-in settings collector skips; the custom
      # query is what exports pg_settings_archive_mode for postgres-alerts.yml (DL-160).
      - --extend.query-path=/etc/postgres_exporter/queries.yml
      # The wal collector calls pg_ls_waldir(), which needs pg_monitor: with the read-only
      # role it fails every scrape and logs an ERROR in PostgreSQL. Nothing reads it.
      - --no-collector.wal
    volumes:
      - ../ops/postgres-exporter/queries.yml:/etc/postgres_exporter/queries.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9187/metrics | grep -q '^pg_up 1$$'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "9187:9187"

  prometheus:
    profiles: ["apps", "observability"]
    image: prom/prometheus:v3.5.0
    container_name: stats-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ../ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../ops/prometheus:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # STARTED, never HEALTHY (DL-167). Monitoring must not depend on the health of what
    # it monitors: gated on healthy, an Input that fails its readiness probe would keep
    # Prometheus from starting, and the one moment you need `up == 0` on the targets
    # page is the moment there would be no Prometheus to show it. These entries exist
    # only so that `--profile observability` alone still brings up every target; a
    # target that is down is scraped as down. MonitoringIsIndependentTest guards this.
    depends_on:
      stats-input:
        condition: service_started
      stats-writer:
        condition: service_started
      stats-api:
        condition: service_started
      postgres-exporter:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.6.0
    container_name: stats-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # Datasource and dashboard provider; the dashboards are generated JSON
      # (ops/grafana/build-dashboards.py) and are read-only in the UI on purpose.
      - ../ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  postgres-wal-archive:
  rabbitmq-data:
  prometheus-data:
