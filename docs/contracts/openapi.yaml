# Stats App — Stats API (Module 3) v1
#
# Status:  DRAFT — FOR ZC CONFIRMATION
# Owner:   Naman and Mukesh
# Source:  docs/contracts/openapi-v1-design.md (design input)
#          docs/source/Datahub_Core_StatsApp_ARD_v1_1.pdf §8 (endpoints, query rules)
#          docs/requirements/SRS-v1.2-amendment.md STA-30A…STA-38A
#          ADR-006 (tenant isolation and API security) — ACCEPTED
#
# Why this file exists: answered conflict C2. ZC's position was "please create an
# OpenAPI definition and we will confirm/decline it", so writing this is our action,
# not a wait on them (CLAUDE.md §7). It was meant to gate Phase 4; on 26 Sep 2026 the
# controllers were built against this draft ahead of confirmation, by decision (DL-162).
# A change ZC asks for is now rework in stats-api as well as here — that is the accepted
# risk, not a reason to treat this file as frozen.
#
# SCOPE: the read-only Stats API only. The Heimdal inbound POST contract is a
# different audience, a different auth mode and a different release cadence; it
# lives in docs/contracts/heimdal-input-contract-v1.md and, since DL-145, in its
# OpenAPI twin docs/contracts/openapi-input.yaml — which $refs the schemas below
# rather than restating them. It is NOT in this file; the two are rendered onto one
# reviewable page by docs/contracts/build-html.sh.
# The /actuator/** endpoints are platform-only (ARD v1.1 §8.1) and are deliberately
# absent from a consumer-facing contract. There is no /v1/openapi discovery route:
# Q1a answered that no internal reference repo exists, so there is no platform
# convention to follow, and inventing one is not our call.
#
# SCHEMA DRIFT GATE. The per-type `data` schemas below are inlined
# rather than $ref'd out to docs/schemas/*.schema.json, so this file stays a single
# self-contained artifact when it is circulated. That creates a drift risk between
# two sources of truth. The JSON Schema catalogue REMAINS AUTHORITATIVE for
# validation; this file is authoritative for the HTTP contract. CI runs
# `docs/contracts/check_schema_drift.py` and fails when their validation-relevant
# shapes disagree.

openapi: 3.1.0

info:
  title: Zenner Datahub Core — Stats App API
  version: 1.0.0-draft
  summary: Read-only, tenant-scoped access to gateway statistics.
  description: |
    Read-only access to the statistics the Stats App receives from Heimdal Core,
    buffers through RabbitMQ and persists in PostgreSQL.

    ## Principles

    - **GET only.** No POST, PUT, PATCH or DELETE exists on any `/v1/**` route,
      ever. Non-GET methods return `405` with no side effect. (STA-32, STA-32A)
    - **Tenant comes from the token, never from the caller.** There is no `tenant`
      query parameter, header or body field. The tenant is derived from the
      validated access token's claim and bound into every query, count and cursor
      — including single-record lookup by `uid`. A `tenant` value supplied by a
      caller is ignored, never honoured. (STA-34A, STA-35A, ADR-006)
    - **`maintenant` is not an isolation field.** It is stored and returned, and it
      is never filtered on. On every tenant but one `tenant` and `maintenant` hold
      the same value — the platform sets both on a tenant move — so an
      implementation that filters on the wrong one passes every test written from
      real data and leaks in production. The one exception is minol, where roughly
      one live record in ten carries `tenant: minol-gateway` with `maintenant: minol`
      (DL-146); a filter on `maintenant` there would drop those rows, which is a
      *different* wrong answer, not a safe one. (CLAUDE.md §6 — the highest-risk
      item in the project)
    - **Timestamps are Unix epoch SECONDS**, on the wire and in every filter. Not
      milliseconds, not RFC 3339. This matches what Heimdal sends and what
      retention keys on, so a value never changes meaning between ingest and read.
      A 13-digit value is a millisecond timestamp and is rejected. (ARD v1.1 §8.2)
    - **Ordering is fixed and deterministic**: `ts.device DESC, uid DESC`, always,
      not only when a caller asks. There is no `sort` parameter. Without a unique
      tie-breaker a paginated query can return the same row on two pages or skip
      one entirely. (STA-36A)
    - **Pagination is keyset, never offset.** (ARD v1.1 AD-14)
    - **Three ways in, one tenant predicate.** A tenant-wide list
      (`/stats/{type}?from&to`), a device-scoped range
      (`/stats/{type}/{clsbox}/{from}` and `/stats/{type}/{clsbox}/{from}/{to}`,
      added 21 Sep 2026 — DL-151), and a single record by `uid`
      (`/stats/{type}/{uid}`). All three carry the token's tenant into the query;
      none accepts it from the caller. The device-scoped paths and the `uid` path
      are told apart by segment count, never by inspecting the value.

    ## Query and retention basis

    Both `from` and `to` filter on **`ts.device`** — the timestamp the gateway
    reported, not the timestamp Heimdal handled it. Retention keys on the
    same field and defaults to **90 days** (configurable, STA-23A). Two consequences
    a consumer must plan for:

    - A time range older than the retention window is syntactically valid and
      returns an empty page rather than an error.
    - A gateway that was offline delivers records whose `ts.device` is days or weeks
      older than the moment they arrived. Such a record appears in the past, not at
      the head of the list, and may be near expiry when it lands. This is accepted
      business behaviour, not a defect.

    ## Status

    **This contract is a draft pending confirmation.** Items still open are marked
    `PROVISIONAL` in the descriptions below: the maximum query window, and ZC's
    confirmation of the Keycloak issuer, audience, role name and tenant claim
    (Q8b-2 — ADR-006 itself is ACCEPTED). The security values are fail-closed
    configuration with no defaults in code, so confirming them is a configuration
    change and not a code change.
  contact:
    name: Naman and Mukesh
  license:
    name: Internal / Confidential

servers:
  - url: https://{host}/{basePath}
    description: Deployment-supplied host. Path is stable across environments.
    variables:
      host:
        default: stats.example
        description: Ingress host, supplied by the platform.
      basePath:
        default: v1
        description: |
          API version segment. STA-38A: a breaking change requires a new version
          segment or an approved migration — never a redefinition of this one.
  - url: http://localhost:8083/v1
    description: Local development stack (docker/docker-compose.yml).

security:
  - bearerAuth: []

tags:
  - name: stats
    description: Tenant-scoped, read-only statistics retrieval.

paths:

  /stats/{type}:
    parameters:
      - $ref: '#/components/parameters/StatType'
    get:
      tags: [stats]
      operationId: listStats
      summary: List records of one stat type for the authenticated tenant.
      description: |
        Returns a keyset-paginated page of records of `{type}` belonging to the
        tenant in the caller's token, ordered `ts.device DESC, uid DESC`.

        `from` and `to` are **required**. An unbounded scan over a table holding up
        to 115.2 million records a day is not a query anyone recovers from, so the
        contract refuses to express one. This is the **tenant-wide** list and it is
        the only operation subject to `query_window_exceeded`; a single gateway's
        history is read through `/stats/{type}/{clsbox}/{from}[/{to}]`, which the
        covering index bounds by construction. There is no `clsbox` query parameter
        here — one query, one spelling (DL-151).

        **Continuation.** Follow `nextCursor` to fetch the next page, resending
        `from` and `to` unchanged. The cursor carries the filters it was
        issued for; changing one mid-walk invalidates it (`invalid_cursor`) rather
        than silently returning a page from a different query. A `null` or absent
        `nextCursor` means the last page has been reached.

        Requires the read-only role. (STA-33A)
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: |
            A page of records. An authenticated caller with no visible data for the
            range receives an empty `items` array and `200` — never a `403` or a
            `404`, either of which would disclose whether another tenant's data
            exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsPage'
              examples:
                lorastatsPage:
                  $ref: '#/components/examples/LorastatsPage'
                emptyPage:
                  $ref: '#/components/examples/EmptyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /stats/{type}/{uid}:
    parameters:
      - $ref: '#/components/parameters/StatType'
      - $ref: '#/components/parameters/Uid'
    get:
      tags: [stats]
      operationId: getStatRecord
      summary: Retrieve one record by uid for the authenticated tenant.
      description: |
        Returns the single record identified by `{uid}` within `{type}`, scoped to
        the tenant in the caller's token.

        **The tenant predicate applies here exactly as it does to the list
        operation.** A `uid` belonging to another tenant returns `404`, identical in
        every observable respect — status, body, headers, timing class — to a `uid`
        that does not exist at all. The response deliberately cannot be used to
        probe whether a record exists in another tenant. Cross-tenant lookup by
        `uid` is a named release gate. (STA-35A, STA-35B, ADR-006)

        **Routing.** This path has three segments; the device-scoped reads have four
        or five. The two are never distinguished by looking at the value — a
        `CLSCON-`-prefixed `uid` and a 12-hex `clsbox` are only ever read from the
        position the path puts them in.
      responses:
        '200':
          description: The record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatRecord'
              examples:
                lorastats:
                  $ref: '#/components/examples/LorastatsRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'


  /stats/{type}/{clsbox}/{from}:
    parameters:
      - $ref: '#/components/parameters/StatType'
      - $ref: '#/components/parameters/ClsboxPath'
      - $ref: '#/components/parameters/FromPath'
    get:
      tags: [stats]
      operationId: listStatsByClsboxFrom
      summary: List one gateway's records of one stat type from a point in time until now.
      description: |
        Returns a keyset-paginated page of records of `{type}` reported by the gateway
        `{clsbox}` with `ts.device >= {from}`, belonging to the tenant in the caller's
        token, ordered `ts.device DESC, uid DESC`. Added 21 Sep 2026 at management's
        request (DL-151): *"a GET call with MAC address and timestamp — from to now"*.
        `{clsbox}` **is** the MAC address; the wire name is kept (ADR-007 §1).

        **"Until now" means open-ended, not `to = now`.** There is deliberately no
        upper bound. Input accepts a `ts.device` up to `max-clock-skew` (5 min) ahead
        of arrival, so a gateway whose clock runs a few seconds fast has records with
        `ts.device` in the near future; a literal `to = now` would hide its newest
        record on every call. An open bound also keeps the cursor stable — a moving
        `to` would be a different filter on every page.

        **Tenant scope is unchanged.** The tenant predicate is the token's, exactly as
        on the list. A `{clsbox}` that reports under another tenant — or does not
        exist — returns an empty `items` array and `200`, never `404`: the response
        must not disclose whether another tenant's gateway exists. (STA-35A, ADR-006)

        **No window limit.** `(tenant, clsbox, ts_device DESC, uid DESC)` is the
        covering index, so the scan is proportional to the result and the page size
        bounds each request. A `{from}` older than the retention window is valid and
        returns what is retained. `query_window_exceeded` does not apply here.

        **Continuation.** Follow `nextCursor`, resending the same path. The cursor
        binds `{type}`, `{clsbox}`, `{from}` and the tenant; presenting it on a
        different path is `400 invalid_cursor`.

        Requires the read-only role. (STA-33A)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: |
            A page of records. An authenticated caller with no visible data for the
            gateway and range receives an empty `items` array and `200` — never a
            `403` or a `404`, either of which would disclose whether another tenant's
            gateway exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsPage'
              examples:
                lorastatsPage:
                  $ref: '#/components/examples/LorastatsPage'
                emptyPage:
                  $ref: '#/components/examples/EmptyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /stats/{type}/{clsbox}/{from}/{to}:
    parameters:
      - $ref: '#/components/parameters/StatType'
      - $ref: '#/components/parameters/ClsboxPath'
      - $ref: '#/components/parameters/FromPath'
      - $ref: '#/components/parameters/ToPath'
    get:
      tags: [stats]
      operationId: listStatsByClsboxRange
      summary: List one gateway's records of one stat type within a time range.
      description: |
        The bounded form of `/stats/{type}/{clsbox}/{from}`: records of `{type}`
        reported by `{clsbox}` with `{from} <= ts.device < {to}`, belonging to the
        tenant in the caller's token, ordered `ts.device DESC, uid DESC` (DL-151).

        `[from, to)` — inclusive lower bound, exclusive upper bound — exactly as on
        the tenant-wide list, so a consumer can walk consecutive windows without
        overlapping or dropping a boundary record. `{from} >= {to}` is
        `400 invalid_time_range`.

        Tenant scope, the empty-page rule, the absence of a window limit and cursor
        binding are as for the open-ended form; the cursor additionally binds `{to}`.

        Requires the read-only role. (STA-33A)
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: |
            A page of records. An authenticated caller with no visible data for the
            gateway and range receives an empty `items` array and `200` — never a
            `403` or a `404`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsPage'
              examples:
                lorastatsPage:
                  $ref: '#/components/examples/LorastatsPage'
                emptyPage:
                  $ref: '#/components/examples/EmptyPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:

  # === Security ==============================================================

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak-issued OAuth2 / OIDC access token, validated as a resource server.

        `PROVISIONAL — Q8b-2.` ADR-006 is **ACCEPTED**; the isolation decisions are
        settled and buildable. What is provisional is only ZC's confirmation of the
        names below, which are live in the development realm
        (`docs/setup/keycloak-realm-statsapp.json`):

        | Setting | Proposed value |
        |---|---|
        | Realm | `statsapp` |
        | Audience / client | `stats-api` |
        | Required role | `stats.readOnly` |
        | Tenant claim | `tenant` — **single-valued String** |

        The tenant claim is single-valued deliberately. A multi-valued claim turns
        isolation into `tenant IN (...)`, and one misconfigured user then reads
        several tenants with every test still green.

        Every one of these is a configuration property with **no default in code**.
        A token whose tenant claim is absent or empty fails closed — it is rejected,
        never treated as "all tenants".

  # === Parameters ============================================================

  parameters:

    StatType:
      name: type
      in: path
      required: true
      description: |
        The stat type. This is a closed enumeration, matched before any query is
        built — an unrecognised value returns `400 unknown_stat_type` and never
        reaches a table name.

        Adding a type is an additive change: a new value here never alters the
        handling of an existing one. (STA-14, STA-14A, STA-22)
      schema:
        $ref: '#/components/schemas/StatType'
      example: lorastats

    Uid:
      name: uid
      in: path
      required: true
      description: The record's `uid`, as supplied by Heimdal at ingest.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: b2b2b2b2-b2001-4b201-8b201-b2b2b2b2b2b2

    From:
      name: from
      in: query
      required: true
      description: |
        **Inclusive** lower bound on `ts.device`, in Unix epoch **seconds**.

        Bounded to 2000-01-01 … 2100-01-01. A 13-digit millisecond value falls
        outside that range and is rejected with `invalid_parameter` rather than
        being silently reinterpreted.
      schema:
        $ref: '#/components/schemas/UnixSeconds'
      example: 1787054100

    To:
      name: to
      in: query
      required: true
      description: |
        **Exclusive** upper bound on `ts.device`, in Unix epoch **seconds**.

        Inclusivity is asymmetric on purpose: `[from, to)` lets a caller walk
        consecutive windows without overlapping or dropping a boundary record.
        `from >= to` returns `400 invalid_time_range`.
      schema:
        $ref: '#/components/schemas/UnixSeconds'
      example: 1787057700

    ClsboxPath:
      name: clsbox
      in: path
      required: true
      description: |
        The reporting gateway — its MAC address, 12 hexadecimal characters, matched
        case-insensitively. This is `clsbox` on the wire, in the column and here
        (ADR-007 §1); "MAC" is what it is, `clsbox` is what it is called. There is
        no prefix or wildcard form.

        Case-insensitivity is delivered by normalisation, not by the predicate:
        `clsbox` is stored uppercase (the Writer uppercases it, and a CHECK
        constraint enforces it — DL-115), so the filter is `clsbox = upper(:clsbox)`
        and still uses the covering index `(tenant, clsbox, ts_device DESC, uid DESC)`.
        A predicate of the form `upper(clsbox) = ...` would not, and would seq-scan
        every live partition. A value that is not 12 hex characters is
        `400 invalid_parameter` before any query is built.
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{12}$'
      example: A1B2C3D4E5F6

    FromPath:
      name: from
      in: path
      required: true
      description: |
        **Inclusive** lower bound on `ts.device`, in Unix epoch **seconds**, as a
        path segment. Same bounds and rejection rule as the `from` query parameter:
        2000-01-01 … 2100-01-01, and a 13-digit millisecond value is
        `invalid_parameter`, never reinterpreted.
      schema:
        $ref: '#/components/schemas/UnixSeconds'
      example: 1787054100

    ToPath:
      name: to
      in: path
      required: true
      description: |
        **Exclusive** upper bound on `ts.device`, in Unix epoch **seconds**, as a
        path segment. `[from, to)`, as on the list; `from >= to` is
        `400 invalid_time_range`.
      schema:
        $ref: '#/components/schemas/UnixSeconds'
      example: 1787057700

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum records in the page. A page may return fewer; only an absent or
        `null` `nextCursor` means the walk is finished.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 100
      example: 100

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque keyset continuation token, taken verbatim from the previous
        response's `nextCursor`.

        **Opaque means opaque.** It is signed, time-limited, and binds the stat
        type, the tenant, and every filter it was issued for. Do not decode,
        construct, edit or store it. A cursor that has been tampered with, has
        expired, or is presented alongside filters different from the ones it was
        issued for is rejected with `400 invalid_cursor`. It is specifically not
        possible to reach another tenant's rows by editing a cursor — the tenant is
        re-derived from the token and cross-checked against the cursor on every
        request.
      schema:
        type: string
        maxLength: 2048

  # === Reusable responses ====================================================

  responses:

    BadRequest:
      description: |
        The request is malformed or exceeds a documented limit. See the `code` in
        `errors[]` for which of `unknown_stat_type`, `invalid_parameter`,
        `invalid_time_range`, `query_window_exceeded` or `invalid_cursor` applies.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            invalidTimeRange:
              $ref: '#/components/examples/ProblemInvalidTimeRange'
            unknownStatType:
              $ref: '#/components/examples/ProblemUnknownStatType'
            queryWindowExceeded:
              $ref: '#/components/examples/ProblemQueryWindowExceeded'

    Unauthorized:
      description: |
        No token, or a token that is malformed, expired, wrongly issued, or wrongly
        audienced — an authentication failure.

        A token that authenticates but carries **no usable tenant claim** is a
        different case and returns **403**, not 401: the caller proved who they are
        and has no tenant to be scoped to. An absent claim and an empty claim both
        fail closed there, and neither is ever read as "all tenants". (ADR-006)
      headers:
        WWW-Authenticate:
          description: Bearer challenge, per RFC 6750.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            unauthorized:
              $ref: '#/components/examples/ProblemUnauthorized'

    Forbidden:
      description: |
        The token is valid but the caller lacks the read-only role, **or carries no
        usable `tenant` claim** — absent and empty both fail closed here (ADR-006).

        `403` means "you are authenticated and not permitted to use this operation".
        It never means "that data belongs to someone else" — a cross-tenant read is
        an empty `200` or a `404`, because distinguishing the two would disclose the
        existence of another tenant's data.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            forbidden:
              $ref: '#/components/examples/ProblemForbidden'

    NotFound:
      description: |
        No such record **in the caller's tenant**. Deliberately indistinguishable
        from a record that exists under a different tenant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            notFound:
              $ref: '#/components/examples/ProblemNotFound'

    MethodNotAllowed:
      description: |
        A non-GET method was used. The API is read-only and this response carries
        **no side effect** of any kind. (STA-32, STA-32A)
      headers:
        Allow:
          description: Always `GET`.
          schema:
            type: string
            const: GET
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            methodNotAllowed:
              $ref: '#/components/examples/ProblemMethodNotAllowed'

    ServiceUnavailable:
      description: |
        A dependency the API needs is unavailable. The request was not served; it
        is safe to retry. Reads are idempotent.
      headers:
        Retry-After:
          description: Seconds to wait before retrying, when a useful value is known.
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            serviceUnavailable:
              $ref: '#/components/examples/ProblemServiceUnavailable'

  # === Schemas ===============================================================

  schemas:

    StatType:
      type: string
      description: |
        The V1 stat type set. Determines routing key, queue, consumer, table and
        endpoint operation.
      enum:
        - lorastats
        - ltestats
        - sysstats
        - netstats
        - omsstats

    UnixSeconds:
      type: integer
      format: int64
      minimum: 946684800
      maximum: 4102444800
      description: |
        Unix epoch timestamp in **seconds**.

        Bounded to 2000-01-01T00:00:00Z … 2100-01-01T00:00:00Z. The bounds are not
        decoration: they are what turns a millisecond timestamp into a `400` instead
        of a date roughly 53,000 years in the future that retention never reaches
        and no query ever returns.

    Timestamps:
      type: object
      description: |
        The production `ts` block. `server`, `device`, `datastore` and `converter`
        are Unix seconds; `expiresOn` is an ISO-8601 instant, as a string or as
        Extended-JSON `{"$date": …}` (DL-146). Heimdal may also add `deviceOrig` —
        the clock the gateway sent before Heimdal corrected `device` — and a
        top-level `meta.tsDeviceCorrected`; both are preserved. The Stats App performs
        **no timestamp normalisation** — Heimdal already sends the canonical
        `ts.server` (ADR-004, ACCEPTED, amended 29 Aug 2026).

        `converter`, `datastore` and `expiresOn` are stored and returned verbatim
        and are never read. Until 29 Aug 2026 this schema declared a record carrying
        `ts.converter` invalid; production sends it on 100% of records, so that rule
        rejected everything Heimdal sends and was removed (ADR-007 §2).
      required: [server, device]
      properties:
        server:
          allOf:
            - $ref: '#/components/schemas/UnixSeconds'
          description: |
            When Heimdal processed the record — **the canonical arrival clock**
            (ADR-007 §3). This is what the SRS called `ts.processor`. Clock skew is
            measured against it.
        device:
          allOf:
            - $ref: '#/components/schemas/UnixSeconds'
          description: |
            When the gateway measured the record. **This is the field `from`/`to`
            filter on, the field results sort on, and the field retention keys on.**
            It can be substantially older than `server` for a gateway that was
            offline.
        datastore:
          allOf:
            - $ref: '#/components/schemas/UnixSeconds'
          description: |
            The legacy Mongo store's write clock. Preserved and returned, never read;
            it will stop being meaningful once that store is retired.
        converter:
          allOf:
            - $ref: '#/components/schemas/UnixSeconds'
          description: |
            Heimdal's converter clock. Preserved and returned, never read. Presence is
            metered at ingest as `records_converter_ts_present{type}`.
        deviceOrig:
          allOf:
            - $ref: '#/components/schemas/UnixSeconds'
          description: |
            Present when Heimdal has rewritten `device` to equal `server`: the clock the
            gateway actually sent (`meta.tsDeviceCorrected` is set on the same record).
            Preserved and returned, never read (DL-146, Q15f).
        expiresOn:
          oneOf:
            - type: string
            - type: object
              required: ['$date']
              properties:
                '$date': { type: string }
              additionalProperties: false
          description: |
            The legacy Mongo TTL key, an ISO-8601 instant equal to `device`. Preserved
            and returned, never read — Stats App retention is a partition
            detach-and-drop keyed on `ts_device` (ADR-003 D1), not a TTL. Deliberately
            never a Unix-seconds integer. Accepted and returned in either of the two
            forms seen: the plain string of the 29 Aug 2026 sample, or MongoDB Extended
            JSON `{"$date": "<ISO-8601>"}` as the live datastore returns it. Which one
            the HTTP forward emits is open (Q15e, DL-146); the value is stored verbatim
            in whichever form it arrived.
      additionalProperties: true

    Envelope:
      type: object
      description: |
        The fields present on every record regardless of type. Only `data` differs
        between types.
      required: [uid, tenant, maintenant, clsbox, type, ts, data]
      properties:
        uid:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            The record's unique identifier, supplied by Heimdal — never generated by
            the database. Unique per `(ts_device, uid)`, which is what makes a
            redelivered message a no-op rather than a duplicate row. (STA-21B)
        tenant:
          type: string
          minLength: 1
          description: |
            The tenant the gateway is assigned to. **The isolation field.** Always
            equal to the caller's own token claim — a caller can never observe any
            other value here, so returning it discloses nothing.
        maintenant:
          type: string
          minLength: 1
          description: |
            The *managing* tenant. Stored and returned for completeness and
            **never used for isolation or filtering**. Frequently identical to
            `tenant` in sample data; that resemblance is the trap, not the rule.
        clsbox:
          type: string
          pattern: '^[0-9A-Fa-f]{12}$'
          description: |
            The reporting device identifier, 12 hexadecimal characters. Named
            `clsbox` on the wire, in the database column, and here — the SRS called
            it `gateway`, a name no production record has ever used (ADR-007 §1).

            **Always returned uppercase**, whatever case the record arrived in. The
            wire accepts either (`^[0-9A-Fa-f]{12}$`) so a lowercase record is never
            rejected, but one device must not become two index keys (DL-115). The
            pattern here stays permissive so a client that echoes this value back
            into the `clsbox` filter cannot be broken by the normalisation.
        type:
          $ref: '#/components/schemas/StatType'
        version:
          type: integer
          minimum: 1
          description: |
            Heimdal's record version, stored and returned as received. **Not a payload
            discriminator** — all three mutually incompatible lorastats payload
            dialects observed in production carry `version: 1` (ADR-007 §4). Never
            branch on it.
        ts:
          $ref: '#/components/schemas/Timestamps'
        data:
          type: object
          description: |
            The type-specific payload — the only part of a record that differs
            between stat types. Refined to a concrete shape by each per-type
            schema below.

            Declared here rather than only in the per-type schemas on purpose:
            `additionalProperties: false` on this object is evaluated per subschema,
            so a member that `allOf` composition adds later but this object never
            names is rejected as an unexpected property.
        status:
          type: array
          items:
            type: string
          description: |
            Heimdal converter annotations, e.g. `["conversion ok"]`. Stored and
            returned verbatim and never interpreted — this is upstream state, not
            Stats App state.
        meta:
          type: object
          additionalProperties: true
          description: |
            Heimdal annotations about the record, e.g. `{"tsDeviceCorrected": true}`
            when `ts.device` was rewritten upstream. Stored and returned verbatim,
            never read (DL-146).
      additionalProperties: true

    StatRecord:
      description: |
        One stored record. The concrete shape is selected by `type`; within a single
        request every item is of the type named in the path.
      oneOf:
        - $ref: '#/components/schemas/LorastatsRecord'
        - $ref: '#/components/schemas/LtestatsRecord'
        - $ref: '#/components/schemas/SysstatsRecord'
        - $ref: '#/components/schemas/NetstatsRecord'
        - $ref: '#/components/schemas/OmsstatsRecord'
      discriminator:
        propertyName: type
        mapping:
          lorastats: '#/components/schemas/LorastatsRecord'
          ltestats: '#/components/schemas/LtestatsRecord'
          sysstats: '#/components/schemas/SysstatsRecord'
          netstats: '#/components/schemas/NetstatsRecord'
          omsstats: '#/components/schemas/OmsstatsRecord'

    StatsPage:
      type: object
      description: One page of a keyset walk.
      required: [items, limit]
      properties:
        items:
          type: array
          description: |
            The page's records, ordered `ts.device DESC, uid DESC`. Empty when the
            range holds nothing visible to the caller.
          items:
            $ref: '#/components/schemas/StatRecord'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
          description: |
            Opaque continuation token for the next page, or `null` on the last page.
            Pass it back verbatim as `cursor`. **Do not infer completion from
            `items.length < limit`** — a page may be short and still have a
            successor.
        limit:
          type: integer
          format: int32
          description: The effective limit applied, after defaulting and clamping.
      additionalProperties: false

    # --- Per-type payloads ---------------------------------------------------
    #
    # Mirrors of docs/schemas/<type>-v1.schema.json. That catalogue is the
    # authoritative validation contract; these exist so this document can be
    # circulated on its own. The drift gate described in the file header checks
    # these projections against the validation catalogue on every CI run.
    #
    # `additionalProperties: true` on every `data` object is deliberate (D14):
    # unknown members inside `data` are accepted at ingest, preserved, and returned
    # here unchanged. Envelope fields do not get that latitude.

    LorastatsRecord:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: lorastats
            data:
              $ref: '#/components/schemas/LorastatsData'

    LorastatsData:
      type: object
      description: |
        LoRa radio counters. Every counter is stored as `BIGINT` — a 32-bit column
        would wrap silently on a long-lived gateway and corrupt the value with no
        error anywhere.

        Production sends `lorastats` in **three** incompatible dialects: bare field
        names with integer values, bare names with string values (`"176"`), and
        `lora_`-prefixed names (`lora_rx_nr_pkts`). All three carry `version: 1`, so
        nothing on the record discriminates them — detection is structural, and
        `version` is never the discriminator.

        **All three are accepted and normalised to this one shape** (DL-105, 4 Sep
        2026, reversing ADR-007 §4), so a reader of this API never sees a dialect.
        The enumeration is closed at three; an unknown fourth is dead-lettered rather
        than guessed at. String counters are range-checked against the signed 64-bit
        maximum before conversion and dead-letter on overflow.

        Ingestion of all three dialects is **built** (T-063, 8 Sep 2026, DL-127):
        the Writer detects the dialect structurally and normalises it into these
        columns, so the dialect a record arrived in is not queryable and not
        returned. It is carried as the metric label
        `records_lorastats_dialect{dialect}` instead.
      required:
        [rx_nr_pkts, rx_crc_missing, rx_crc_bad, tx_success, tx_failed, tx_peek,
         tx_peek_index_zero, tx_override, tx_busy, tx_dequeue_error, tx_type_beacon,
         chip_comm_error, util_fopen_failed]
      properties:
        rx_nr_pkts: { type: integer, format: int64 }
        rx_crc_missing: { type: integer, format: int64 }
        rx_crc_bad: { type: integer, format: int64 }
        tx_success: { type: integer, format: int64 }
        tx_failed: { type: integer, format: int64 }
        tx_peek: { type: integer, format: int64 }
        tx_peek_index_zero: { type: integer, format: int64 }
        tx_override: { type: integer, format: int64 }
        tx_busy: { type: integer, format: int64 }
        tx_dequeue_error: { type: integer, format: int64 }
        tx_type_beacon: { type: integer, format: int64 }
        chip_comm_error: { type: integer, format: int64 }
        util_fopen_failed: { type: integer, format: int64 }
        rx_short_pkt: { type: integer, format: int64, description: 'Optional. Observed in production; not on every record.' }
        fsk_received: { type: integer, format: int64, description: 'Optional. Observed in production; not on every record.' }
        rx_type_arol: { type: integer, format: int64, description: 'Optional. Observed in production on the string-valued dialect only.' }
        timespan: { type: integer, format: int64, minimum: 0, description: 'Optional. Reporting window in seconds, as an integer here.' }
      additionalProperties: true

    LtestatsRecord:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: ltestats
            data:
              $ref: '#/components/schemas/LtestatsData'

    LtestatsData:
      description: |
        LTE modem signal and network identity — **one of two closed shapes**
        (DL-146, 18 Sep 2026). A modem reports either a measurement
        (`LtestatsMeasured`) or the reason it has none (`LtestatsUnknownTechnology`).
        Live data on 18 Sep 2026 showed both, and the earlier single-shape schema
        dead-lettered every 2G fallback and every modem that never registered — the
        records ops most needs. A record matching neither shape, or carrying `etxt`
        next to a partial measurement, is dead-lettered by the Writer (ADR-007 §5).
      oneOf:
        - $ref: '#/components/schemas/LtestatsMeasured'
        - $ref: '#/components/schemas/LtestatsUnknownTechnology'

    LtestatsMeasured:
      title: measured
      type: object
      description: |
        `imsi` is a subscriber identifier and is classified sensitive operational
        data (ARD v1.1 §9). Whether it is returned in full, masked, or withheld from
        some consumers is **not settled** — it needs the same consumer/security
        review that closes ADR-006. Treated as returned-in-full here so the question
        is visible rather than quietly decided.
        **Every numeric here is a STRING**, and the technology field carries a
        capital T: `access_Technology`. Both were corrected against production on
        29 Aug 2026 (ADR-007) — the previous integer/lowercase declaration came from
        the SRS and each mistake alone dead-lettered 100% of ltestats traffic.
        `rsrp` and `rsrq` are **optional**: they are LTE reference-signal
        measurements and a modem on 2G reports neither (DL-146).
      required: [rssi, access_Technology, operator, plmn, imsi, lac, cid]
      not:
        required: [etxt]
        properties:
          etxt: {}
      properties:
        rssi: { type: string, pattern: '^-?(0|[1-9][0-9]{0,18})$', description: 'Received signal strength, dBm, as a string, e.g. "-67".' }
        rsrp: { type: string, pattern: '^-?(0|[1-9][0-9]{0,18})$', description: 'Reference signal received power, dBm, as a string. Optional — absent when the modem is on 2G.' }
        rsrq: { type: string, pattern: '^-?(0|[1-9][0-9]{0,18})$', description: 'Reference signal received quality, dB, as a string. Optional — absent when the modem is on 2G.' }
        access_Technology: { type: string, minLength: 1, description: 'Note the capital T. Production spelling; the lowercase form has never appeared on the wire. Observed values: "4G", "2G".' }
        operator: { type: string, minLength: 1 }
        plmn: { type: string, pattern: '^[0-9]{5,6}$', description: 'Public land mobile network code, as a string.' }
        imsi: { type: string, pattern: '^[0-9]{1,20}$', description: 'SENSITIVE — masking policy pending review.' }
        lac: { type: string, pattern: '^[0-9A-Fa-f]{1,16}$', description: 'Location area code, hexadecimal, as reported.' }
        cid: { type: string, pattern: '^[0-9A-Fa-f]{1,16}$', description: 'Cell identifier, hexadecimal, as reported.' }
        timespan: { type: string, pattern: '^(0|[1-9][0-9]{0,18})$', description: 'Reporting window in seconds, as a string. Optional — production omits it on some records.' }
      additionalProperties: true

    LtestatsUnknownTechnology:
      title: unknown-technology
      type: object
      description: |
        A modem that never registered on any network: `{"etxt": "unknown technology"}`
        and no measurement at all. Closed (`additionalProperties: false`) so that
        `etxt` beside a partial measurement matches neither shape and is dead-lettered
        — half a measurement is not a known shape (DL-146).
      required: [etxt]
      properties:
        etxt: { type: string, minLength: 1, description: 'Free-text reason the modem produced no measurement. Observed value: "unknown technology".' }
      additionalProperties: false

    SysstatsRecord:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: sysstats
            data:
              $ref: '#/components/schemas/SysstatsData'

    SysstatsData:
      type: object
      description: |
        Gateway operating-system health.

        The five optional members below are real production fields that went
        unmodelled until 29 Aug 2026. They are optional because a gateway legitimately
        omits them — that is a device state, not a dialect disagreement, so it is
        accommodated rather than dead-lettered (ADR-007 §5).
      required: [memfree, uptime, idletime, load1, load5, load15, runable]
      properties:
        memfree: { type: integer, format: int64, description: 'Free memory, kilobytes.' }
        uptime: { type: number, format: double, description: 'Seconds since boot.' }
        idletime: { type: number, format: double, description: 'Aggregate CPU idle seconds.' }
        load1: { type: number, format: double }
        load5: { type: number, format: double }
        load15: { type: number, format: double }
        runable:
          type: string
          pattern: '^[0-9]+/[0-9]+$'
          description: |
            Runnable/total process count as reported by the gateway, e.g. `"2/152"`.
            A string, not a number, and the spelling is the SRS's — production agrees.
        temp:
          type: integer
          format: int32
          description: |
            **Optional.** Millidegrees Celsius (`62269` = 62.3 °C). Absent on gateways
            without a temperature sensor.
        rtt:
          type: integer
          format: int32
          description: '**Optional.** Round-trip time as measured by the gateway.'
        wan_if:
          type: string
          minLength: 1
          description: '**Optional.** Active WAN interface, e.g. `wwan`.'
        rebootcause:
          type: string
          minLength: 1
          description: '**Optional.** Reason for the last restart, e.g. `reboot`.'
        timespan:
          type: string
          pattern: '^(0|[1-9][0-9]{0,18})$'
          description: |
            **Optional, and a STRING here** (`"300"`) where `lorastats`, `omsstats` and
            `netstats` send the same concept as an integer (`1800`, `3600`). The wire
            encoding differs per type; do not assume one column type across types
            (ADR-007 §5).
      additionalProperties: true

    OmsstatsRecord:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: omsstats
            data:
              $ref: '#/components/schemas/OmsstatsData'

    OmsstatsData:
      type: object
      description: |
        OMS reception counters over a reporting window. No timestamp normalisation
        is applied to this or any other type (ADR-004).
      required: [rx_nr_pkts, rx_valid_nr_pkts, rx_crc_bad, device_count, timespan]
      properties:
        rx_nr_pkts: { type: integer, format: int64 }
        rx_valid_nr_pkts: { type: integer, format: int64 }
        rx_crc_bad: { type: integer, format: int64 }
        device_count: { type: integer, format: int64 }
        timespan: { type: integer, format: int64, minimum: 0, description: 'Reporting window length, seconds.' }
      additionalProperties: true

    NetstatsRecord:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            type:
              const: netstats
            data:
              $ref: '#/components/schemas/NetstatsData'

    NetstatsData:
      type: object
      x-interface-name-pattern: '^(?!timespan$)[A-Za-z][A-Za-z0-9_.:-]{0,14}$'
      description: |
        Per-interface network counters and addressing.

        `eth0` and `wwan` are mandatory. **Any other interface name is accepted**
        and validated against the same shape, so a gateway reporting a new interface
        never requires a schema change (Q4a, STA-14A).

        Interface names are matched against
        `^(?!timespan$)[A-Za-z][A-Za-z0-9_.:-]{0,14}$`. OpenAPI's
        `patternProperties` support is uneven across tooling, so this document
        expresses the additional interfaces through `additionalProperties` instead
        of the negative-lookahead pattern; `docs/schemas/netstats-v1.schema.json`
        carries the exact form and remains authoritative for validation.
      required: [timespan, eth0, wwan]
      properties:
        timespan:
          type: integer
          format: int64
          minimum: 0
          description: Reporting window length, seconds.
        eth0:
          $ref: '#/components/schemas/NetworkInterface'
        wwan:
          $ref: '#/components/schemas/NetworkInterface'
      additionalProperties:
        $ref: '#/components/schemas/NetworkInterface'

    NetworkInterface:
      type: object
      description: |
        One network interface's addressing and byte counters.

        **Only `tx` and `rx` are required.** `gw`, `ip`, `mask` and `dns` were
        required until 29 Aug 2026, which dead-lettered every record from an
        interface that had not come up — production sends a `wwan` with
        `need_init: "qmi"`, a `fail_count`, and no address at all. A modem that is
        down is a legitimate device state and precisely the record ops most needs
        to see (ADR-007 §5). Strictness is kept where it earns its place: an
        address that IS present must still be a well-formed IPv4.
      required: [tx, rx]
      properties:
        gw:
          $ref: '#/components/schemas/IPv4'
        ip:
          $ref: '#/components/schemas/IPv4'
        mask:
          $ref: '#/components/schemas/IPv4'
        dns:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/IPv4'
        apipa:
          allOf:
            - $ref: '#/components/schemas/IPv4'
          description: |
            **Optional.** ZC's own supplied sample carries `apipa` on `eth0` and
            omits it on `wwan`, so requiring it would reject their own record.
        tx:
          $ref: '#/components/schemas/ByteCounter'
        rx:
          $ref: '#/components/schemas/ByteCounter'
        driver:
          type: string
          minLength: 1
          description: Modem driver, e.g. `qmi`. Production field, wwan only.
        mtu:
          $ref: '#/components/schemas/ByteCounter'
        fail_count:
          $ref: '#/components/schemas/ByteCounter'
        plmn:
          type: string
          pattern: '^[0-9]{5,6}$'
        plmn_list:
          type: array
          items:
            type: string
            pattern: '^[0-9]{5,6}$'
          description: Networks the modem is permitted to attach to.
        need_init:
          type: string
          minLength: 1
          description: Set when the interface requires re-initialisation, e.g. `qmi`.
        last_forced_reset:
          $ref: '#/components/schemas/ByteCounter'
        last_powercycle:
          $ref: '#/components/schemas/ByteCounter'
      additionalProperties: true

    IPv4:
      type: string
      pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$'
      description: |
        Dotted-quad IPv4 address. `PROVISIONAL — Q4b open`: no gateway is known to
        report IPv6 and V1 does not accept it. If ZC confirms IPv6 anywhere in the
        estate, this one definition widens and nothing else changes.
      examples: ['192.168.178.10']

    ByteCounter:
      type: string
      pattern: '^(0|[1-9][0-9]{0,18})$'
      description: |
        A byte counter, carried as a **decimal string, not a number**.

        This is not an oversight. Heimdal sends these as strings, they are stored as
        `BIGINT`, and they are returned in the representation they arrived in so a
        value never changes shape between ingest and read. Constraining it to digits
        means a non-numeric value fails at ingest with a `400` rather than failing a
        cast at query time.

        The 19-digit ceiling rejects anything above 9999999999999999999, but the gap
        between that and the signed `BIGINT` maximum 9223372036854775807 cannot be
        expressed as a pattern — the Writer range-checks before conversion, because
        an unchecked overflow corrupts the value with no error at all.
      examples: ['139303320']

    ProblemDetails:
      type: object
      description: |
        RFC 9457 Problem Details. Every error response in this API uses this shape
        with content type `application/problem+json`.

        **What a problem response never contains:** an access token, a full stored
        record, an `imsi`, a SQL error, a stack trace, an internal queue or table
        name, or anything that reveals whether another tenant's data exists.
        Validation entries name the offending **field and code** and never echo the
        offending **value**.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            Stable URI identifying the error class. The final path segment is the
            machine-readable code — the `FieldError.code` spelling exactly, underscores
            and all (`…/errors/invalid_time_range`), as the inbound contract already
            ships; match on this, never on `title` or `detail`. (The examples used a
            hyphenated spelling until 26 Sep 2026; corrected with the build, DL-162.)
        title:
          type: string
          description: Short human-readable summary. Stable for a given `type`.
        status:
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: |
            Human-readable explanation of this occurrence. Advisory only — its
            wording is not part of the contract and may change without a version bump.
        instance:
          type: string
          description: The request path that produced the error.
        statType:
          $ref: '#/components/schemas/StatType'
        traceId:
          type: string
          description: |
            Correlation identifier for this request. Quote it in a support request;
            it is the fastest route to the corresponding server-side log entry.
        errors:
          type: array
          description: Per-field detail, when the failure is a validation failure.
          items:
            $ref: '#/components/schemas/FieldError'
      additionalProperties: true

    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
          description: Name of the offending parameter or field.
        code:
          type: string
          description: |
            Machine-readable reason. The catalogue for this API:

            | Code | HTTP | Meaning |
            |---|---|---|
            | `unknown_stat_type` | 400 | `{type}` is not one of the five V1 types. |
            | `invalid_parameter` | 400 | A parameter is malformed, out of range, or a millisecond timestamp. |
            | `invalid_time_range` | 400 | `from >= to`. |
            | `query_window_exceeded` | 400 | `to - from` exceeds the permitted window on the tenant-wide list. Device-scoped reads are not subject to it. |
            | `invalid_cursor` | 400 | Cursor is malformed, expired, tampered with, or issued for different filters. |
            | `unauthorized` | 401 | Missing, malformed, expired, wrongly issued or wrongly audienced token. |
            | `forbidden` | 403 | Authenticated, but lacks the read-only role **or has no usable `tenant` claim** — absent and empty both fail closed here (ADR-006). |
            | `record_not_found` | 404 | No such `uid` **in the caller's tenant**. |
            | `method_not_allowed` | 405 | Non-GET method on a read-only API. |
            | `service_unavailable` | 503 | A dependency is unavailable; the read is safe to retry. |

            The exhaustive example set for each of these is task J5's deliverable.
        message:
          type: string
          description: Human-readable detail. Never contains the offending value.

  # === Examples ==============================================================
  # Drawn from docs/schemas/fixtures/valid/*.json so an example is never a
  # hand-written record that no validator has ever seen.
  #
  # ONE deviation from the source fixture is permitted, and only this one: tenant
  # and maintenant are made to differ. Production sends both as "mzc" (see the
  # $comment on every production fixture), and an example carrying that repeats the
  # highest-risk trap in the project into every generated client.
  #
  # The lorastats data blocks are POST-NORMALISATION. The wire carries three
  # dialects; the Writer collapses them into one shape before the INSERT (DL-127),
  # so a prefixed name or a quoted counter in a response example would describe a
  # response this API cannot produce.

  examples:

    LorastatsRecord:
      summary: One lorastats record, in the production wire shape
      description: |
        `valid/lorastats-production-canonical.json` — a real record of 29 August
        2026, unchanged except that `tenant` and `maintenant` are made to differ.
        Production sends both as `mzc`, and an example that repeats that teaches the
        trap instead of the contract.

        The full `ts` block as production sends it — five members, of which only
        `server` and `device` are ever read — plus `version` and `status`. Note that
        `uid` is `CLSCON-`-prefixed, not a bare UUID, and that `data` carries
        `fsk_received`, `rx_short_pkt` and `timespan` alongside the thirteen required
        counters. A real record is not the required minimum.
      value:
        uid: CLSCON-11d3ec4c-f6e1-403a-a9ef-b6f5fe909eee
        tenant: tenant-alpha
        maintenant: management-parent
        clsbox: 04B64810652B
        type: lorastats
        version: 1
        ts:
          server: 1787833739
          device: 1787833739
          datastore: 1787833739
          converter: 1787833739
          expiresOn: '2026-08-27T12:28:59.074Z'
        status:
          - conversion ok
        data:
          rx_nr_pkts: 219
          fsk_received: 0
          rx_crc_missing: 0
          rx_crc_bad: 48
          tx_peek_index_zero: 0
          tx_success: 0
          rx_short_pkt: 166
          timespan: 1800
          chip_comm_error: 0
          tx_failed: 0
          tx_override: 0
          util_fopen_failed: 0
          tx_peek: 0
          tx_type_beacon: 0
          tx_busy: 0
          tx_dequeue_error: 0

    LorastatsPage:
      summary: A page holding all three dialects, after normalisation
      description: |
        Note `tenant` and `maintenant` differ. That is the case the contract is
        designed around: filtering on `maintenant` would return other tenants' rows.
        It is also the only edit made to these three records — production sends both
        values as `mzc`.

        **These are the three consecutive production `lorastats` records of 29 August
        2026 — one per dialect — as this API returns them.** On the wire the first
        had every counter quoted (`"rx_nr_pkts": "176"`) and the second was
        `lora_`-prefixed (`lora_rx_nr_pkts: 220`). The Writer normalises both into
        the bare integer members below before the `INSERT` (DL-127), so **no
        prefixed name and no quoted counter can appear in a response**, and the
        dialect a record arrived in is neither queryable nor returned. It is carried
        as `records_lorastats_dialect{dialect}`.

        The optional members differ per item because the devices sent different ones:
        the first carries `rx_type_arol` and neither `timespan` nor `fsk_received`,
        the other two the reverse. An unset counter is **omitted**, never returned as
        `null`. Items are in `ts.device DESC, uid DESC` order, always — see
        `StatsPage.items`.
      value:
        items:
          - uid: CLSCON-a47b270f-b075-46e2-a2e2-f0dc662d094c
