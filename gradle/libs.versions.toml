# Stats App — Gradle version catalog.
#
# THE single source of dependency versions for the whole build (G6, 18 Aug 2026).
# Module build files must NEVER declare their own versions — CLAUDE.md §3, ADR-001.
#
# Libraries listed without a `version` inherit theirs from the Spring Boot BOM
# (`spring-boot-bom` below), which every module imports as a platform. That is
# deliberate: it means bumping `springBoot` moves the entire dependency set as one
# tested, coherent unit instead of a pile of independently drifting pins.

[versions]
# PINNED, not provisional. ZC answered "> 3.5.x", which is not a reproducible build
# version, so G6 pinned an exact one. Q1a was then answered on 18 Aug 2026 — there
# is no internal reference repo, so there is nothing left to reconcile this against.
# It is still a single entry so that a future platform standard is a one-line change;
# that is why no module may pin its own. (CLAUDE.md §3, ADR-001, G6, 2B-ANSWERS §1)
springBoot = "3.5.16"

# Java 21 — CONFIRMED, not 17. (ADR-001)
java = "21"

[libraries]
# Platform. Imported by every module in the root `subprojects` block; it is what
# lets the version-less entries below resolve.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

# --- starters ---------------------------------------------------------------
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
# Actuator backs the separate liveness/readiness probes of D13.
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }

# --- shared model -----------------------------------------------------------
# stats-common carries the envelope DTO and the AMQP topology constants. It gets
# annotations only — no Spring context, no broker, no driver.
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api" }

# --- persistence (stats-writer, plus read-only use in stats-api) ------------
postgresql = { module = "org.postgresql:postgresql" }
# Flyway is DECIDED (ADR-003 D6). It was provisional only pending Q1a, and Q1a was
# answered on 18 Aug 2026: there is no internal reference project to standardise on
# Liquibase instead. Plain-SQL migrations suit partition DDL far better than XML.
# flyway-database-postgresql is mandatory from Flyway 10 onward for PG support.
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# --- test -------------------------------------------------------------------
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-rabbit-test = { module = "org.springframework.amqp:spring-rabbit-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-rabbitmq = { module = "org.testcontainers:rabbitmq" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
