      - series: 'process_uptime_seconds{instance="writer-a"}'
        values: '0+60x2880'
      - series: 'process_uptime_seconds{instance="writer-b"}'
        values: '0+60x2880'
    alert_rule_test:
      - eval_time: 25h
        alertname: StatsAppRetentionSweepMissing
        exp_alerts: []
      - eval_time: 47h
        alertname: StatsAppRetentionSweepMissing
        exp_alerts: []

  - name: a sweep that stops is critical thirty minutes after the twenty-six hour mark
    interval: 1m
    input_series:
      - series: 'retention_last_sweep_timestamp_seconds{type="lorastats",instance="writer-a"}'
        values: '0x1700'
      - series: 'process_uptime_seconds{instance="writer-a"}'
        values: '0+60x1700'
    alert_rule_test:
      - eval_time: 26h
        alertname: StatsAppRetentionSweepMissing
        exp_alerts: []
      - eval_time: 27h
        alertname: StatsAppRetentionSweepMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              type: lorastats
            exp_annotations:
              summary: "Stats App lorastats: no completed retention sweep in over 26 hours"
              description: >-
                No Writer replica has completed a retention sweep for lorastats in
                more than 26 hours (the schedule is daily). Ingestion is unaffected and every
                other counter reads healthy; the only symptom is storage that stops going
                down. Check pg_locks for an advisory lock held by a session that is not
                running maintenance (a leaked lock starves every replica — trap 27's sibling),
                pg_inherits.inhdetachpending, and that the scheduler thread is alive.
              runbook: docs/runbooks/retention-policy.md

  - name: a sweep that has NEVER run on any replica is critical once the process has been up long enough, and quiet before
    interval: 1m
