# Main-queue, late-arrival and upstream-status alerts.
#
# Evaluated from the Writer's /actuator/prometheus scrape, beside dlq-alerts.yml.
# Every rule aggregates replica observations with `max by (type)` — each Writer
# replica polls the same broker queue and reports the same shared resource —
# or sums per-replica COUNTERS, which are genuinely per replica.
#
# Never depth. Under jitter a cyclic depth spike on a main queue is not
# the buffer working, it is evidence the jitter answer is wrong; the signal that says
# "the Writer is not keeping up" is how long the oldest message has waited.
#
# Three rules read one gauge, and the three are ONE alert:
#   queue_oldest_message_age_seconds is sampled at delivery and therefore stops
#   moving when deliveries stop. StatsAppMainQueueAging fires when the Writer is running
#   and behind; StatsAppMainQueueNoConsumer and StatsAppConsumerStalled cover the two
#   cases in which the gauge cannot move — no consumer, or a consumer that is registered
#   and not taking messages — from what the broker poll DOES know. Read them together.
groups:
  - name: stats-app-writer
    rules:
      # ---- Oldest-message age on app_statsstore.<type> ------------------------
      # 300 s: a fresh record has waited longer than tier 2's retry delay. Under the
      # expected ~267/s per type against a ~2,000/s drain the age is seconds; five
      # minutes sustained for five minutes is the Writer behind, not a burst.
      - alert: StatsAppMainQueueAging
        expr: max by (type) (queue_oldest_message_age_seconds) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Stats App {{ $labels.type }} main queue: oldest message is {{ $value | humanizeDuration }} old"
          description: >-
            The oldest ready message on app_statsstore.{{ $labels.type }} has waited more
            than five minutes for the Writer, for at least five minutes. The Writer is
            consuming but not keeping up: check records_processing_duration,
            records_postgres_errors and the retry counters before touching capacity.
            Depth is a diagnostic here, not the alert.
          runbook: docs/runbooks/queue-troubleshooting.md

      # 1,800 s: longer than the longest retry tier. A record this old on a MAIN queue
      # has never been attempted; at 267/s that is ~480k records waiting per type.
      - alert: StatsAppMainQueueAgingCritical
        expr: max by (type) (queue_oldest_message_age_seconds) > 1800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Stats App {{ $labels.type }} main queue: oldest message is {{ $value | humanizeDuration }} old"
          description: >-
            The oldest ready message on app_statsstore.{{ $labels.type }} has waited more
            than thirty minutes. Records are not being lost — the queue is durable — but
            the backlog is now longer than the retry arm, and a Heimdal replay on top of it
            will be held at the 503 backpressure channel.
          runbook: docs/runbooks/queue-troubleshooting.md

      # The gauge's first blind spot: nothing is consuming, so nothing is sampled.
      # Only when the poll SUCCEEDED — a NaN from a failed poll never compares equal to
      # zero, so a broker the Writer cannot see does not read as "no consumer"; that is
      # StatsAppBrokerObservationStale below.
      - alert: StatsAppMainQueueNoConsumer
        expr: >-
          max by (type) (consumer_availability) == 0
          and max by (type) (broker_metrics_collection_success) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Stats App {{ $labels.type }} main queue has no consumer"
          description: >-
            The broker reports zero consumers on app_statsstore.{{ $labels.type }} while
            the Writer's poll succeeds. Every record for this type is now waiting, and
            queue_oldest_message_age_seconds cannot say so because it is sampled at
            delivery. Check that a Writer for this type is deployed and its listener
            started (stats.writer.stat-type, StatTypeDeploymentGuard).
          runbook: docs/runbooks/queue-troubleshooting.md

      # The second blind spot: a consumer is registered but has taken nothing for ten
      # minutes while messages are ready. A listener blocked in a hung database call
      # looks exactly like this and like nothing else.
      - alert: StatsAppConsumerStalled
        expr: >-
          max by (type) (queue_depth) > 0
          and sum by (type) (increase(records_consumed_total[10m])) == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Stats App {{ $labels.type }} consumer has taken no delivery in 10 minutes"
          description: >-
            app_statsstore.{{ $labels.type }} has ready messages and records_consumed has
            not moved for ten minutes across every replica. The consumer is present but
            not consuming — a wedged listener, a hung connection, or a prefetch window
            held unacknowledged. Restart the Writer for this type; nothing is lost while
            the deliveries stay unacknowledged.
          runbook: docs/runbooks/queue-troubleshooting.md

      # A failed broker poll writes NaN, not zero. NaN compares false to
      # everything, so the rules above go quiet rather than wrong — this is what says
      # they have gone quiet.
      - alert: StatsAppBrokerObservationStale
        expr: max by (type) (broker_metrics_collection_success) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Stats App {{ $labels.type }} broker observation has been failing for 5 minutes"
          description: >-
            The Writer's passive queue inspection for {{ $labels.type }} has failed on
            every poll for five minutes. queue_depth, dlq_depth and consumer_availability
            are NaN and the queue alerts cannot fire. Check the broker and the Writer's
            AMQP connection; do not read the quiet as healthy.
          runbook: docs/runbooks/queue-troubleshooting.md

      # ---- Late arrival: a signed obligation ------------------
      # "Alert when non-zero." A counter is non-zero forever once it has moved, so the
      # rule is on its INCREASE: one late record in the last hour is one alert, and a
      # systemic gateway backlog keeps it firing. Summed, not maxed — every replica
      # counts its own skips.
      - alert: StatsAppLateArrival
        expr: sum by (type) (increase(records_expired_on_arrival_total[1h])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Stats App {{ $labels.type }}: {{ $value | humanize }} record(s) arrived past the retention window in the last hour"
          description: >-
            A valid {{ $labels.type }} record arrived with ts.device already older than
            the retention window and was skipped, metered and ACKed — deliberate data loss
            by a signed decision. A gateway back from a long outage does this once;
            a fleet doing it every cycle is a clock or connectivity problem upstream.
            If a DLQ redrive is in progress, this is the ~90-day trap: the redriven
            records are too old to store and are NOT being recovered.
          runbook: docs/runbooks/dlq-redrive.md

      # ---- The failure arm itself is broken -----------------------------
      # A record that failed is handed to a retry tier or the DLQ, and the original is
      # ACKed only once that copy is confirmed. When the copy is NOT confirmed — a retry
      # or DLQ queue missing, a broker refusing publishes under a resource alarm — the
      # original goes back to its main queue after a pause and this counter moves. Every
      # record that needs the failure arm is then cycling instead of progressing, and the
      # pause slows the whole type, so this pages. Summed: each replica counts its own.
      - alert: StatsAppFailureHandoffUnconfirmed
        expr: sum by (type) (increase(records_handoff_unconfirmed_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Stats App {{ $labels.type }}: {{ $value | humanize }} failed record(s) could not be handed to a retry tier or the DLQ in 5 minutes"
          description: >-
            The broker did not confirm the retry or dead-letter copy of a failed
            {{ $labels.type }} record, so the original was returned to its main queue
            instead. Nothing is lost, but nothing that needs the failure arm progresses,
            and the requeue pause slows this type's consumption. Check that
            app_statsstore.{{ $labels.type }}.retry.1-3 and .dlq exist and are bound to
            app_stats_dlx, and the broker's memory and disk alarms. Restarting the
            Writer redeclares missing queues.
          runbook: docs/runbooks/queue-troubleshooting.md

      # ---- Upstream conversion status ---------------------------
      # A ratio of not-OK to consumed over an hour. THE THRESHOLD IS PROVISIONAL:
      # it was found that some upstream documents carry ["ok"] where stats records carry
      # ["conversion ok"], and the counter is value-agnostic by design, so a healthy
      # baseline may be non-zero. Read the first 24 h of ingest, set this to a small
      # multiple of the observed baseline, and record the number.
      - alert: StatsAppUpstreamStatusNotOk
        expr: >-
          sum by (type) (increase(records_upstream_status_not_ok_total[1h]))
            / sum by (type) (increase(records_consumed_total[1h])) > 0.01
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Stats App {{ $labels.type }}: {{ $value | humanizePercentage }} of records report a non-OK upstream status"
          description: >-
            More than the configured share of consumed {{ $labels.type }} records carried
            a status other than ["conversion ok"] for a sustained hour. The records are
            stored regardless; this is Heimdal's converter reporting trouble, not
            ours. The 1% threshold is PROVISIONAL until the first 24 h of ingest set it —
            see ops/prometheus/README.md.
          runbook: docs/runbooks/queue-troubleshooting.md

      # ---- Retention sweep not running ---------------------------
      # The sweep runs once a day per type behind a SESSION-level advisory lock. Two
      # things stop it with no other symptom: a lock leaked by a dead replica's pooled
      # connection (which starves EVERY replica of that type until the connection is
      # evicted), and a scheduler that never fires (the first stack run found 29 hours
      # without a pass and every gauge reading healthy). retention_oldest_partition_age_days
      # cannot catch either — a sweep that never ran leaves it where it was — so the sweep
      # stamps retention_last_sweep_timestamp_seconds on completion and this rule reads
      # it. Only the replica that wins the lock stamps it, hence max by (type); the
      # gauge is NaN until a replica's first sweep, and max ignores NaN unless every
      # replica is NaN — which is the "never ran anywhere" case, caught by the second arm
      # once the process has been up longer than a schedule period plus slack.
      - alert: StatsAppRetentionSweepMissing
        expr: >-
          (time() - max by (type) (retention_last_sweep_timestamp_seconds) > 93600)
          or
          (
            (max by (type) (retention_last_sweep_timestamp_seconds) != max by (type) (retention_last_sweep_timestamp_seconds))
            and on () (max(process_uptime_seconds) > 93600)
          )
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Stats App {{ $labels.type }}: no completed retention sweep in over 26 hours"
          description: >-
            No Writer replica has completed a retention sweep for {{ $labels.type }} in
            more than 26 hours (the schedule is daily). Ingestion is unaffected and every
            other counter reads healthy; the only symptom is storage that stops going
            down. Check pg_locks for an advisory lock held by a session that is not
            running maintenance (a leaked lock starves every replica),
            pg_inherits.inhdetachpending, and that the scheduler thread is alive.
          runbook: docs/runbooks/retention-policy.md
