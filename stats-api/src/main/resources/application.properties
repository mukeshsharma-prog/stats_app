# Module 3 — Stats API. See DEVELOPMENT.md §4.
# Values marked TBC are left COMMENTED OUT on purpose — see the note in
# stats-input/src/main/resources/application.properties.

spring.application.name=stats-api
server.port=8083

# Read-only database user. The "only Module 2 writes" rule (STA-32) is enforced by
# GRANT, not by convention — that way a mistake in code fails loudly at the
# database instead of silently writing.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/statsdb}
spring.datasource.username=${POSTGRES_RO_USER:stats_ro}
spring.datasource.password=${POSTGRES_RO_PASSWORD:stats_ro}

# Keycloak — ADR-006 is ACCEPTED. Q8b was answered on 18 Aug 2026 by building the
# realm: docs/setup/keycloak-realm-statsapp.json. ZC's confirmation (Q8b-2) is
# still outstanding, which is exactly why every value below is a property.
#
# These properties are deliberately given NO defaults. Confirming them is a config
# change, not a code change — and an unset value stops the module starting rather
# than starting with a guessed security posture. Fail closed, always:
#   - no `tenant` claim      -> 403. It never means "all tenants".
#   - empty `tenant` claim   -> 403.
#   - no stats.readOnly role -> 403.
#   - caller-supplied tenant -> ignored; the claim always wins.
# Dev: http://localhost:8080/realms/statsapp. Production: the real HTTPS issuer.
# This is matched against the token's `iss` claim as a STRING — Spring does not
# fetch it when a jwk-set-uri is supplied. That is what lets one issuer value be
# correct whether the module runs on your machine or inside compose; a
# containerised module gets SPRING_SECURITY_..._JWK_SET_URI pointed at
# keycloak:8080 instead. Leave that unset everywhere else and discovery is used.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER}
stats.security.audience=${STATS_API_AUDIENCE}
stats.security.read-role=${STATS_READ_ONLY_ROLE}
stats.security.tenant-claim=${STATS_TENANT_CLAIM}

# Pagination — deterministic sort is mandatory, not caller-selectable. Without an
# explicit (ts_device DESC, uid DESC) sort a paginated query can return the same
# row twice or skip one entirely. (CLAUDE.md §6)
stats.api.default-page-size=100
stats.api.max-page-size=1000
# stats.api.max-query-window-days=TBC   # D12 — document the max query window

# Health — D13. Readiness probes only this module's real dependencies: PostgreSQL
# and Keycloak. NOT RabbitMQ — this module has no broker connection (Q3a).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

logging.structured.format.console=ecs
