# Module 3 — Stats API. See DEVELOPMENT.md §4.
# Values marked TBC are left COMMENTED OUT on purpose — see the note in
# stats-input/src/main/resources/application.properties.

spring.application.name=stats-api
server.port=8083

# Read-only database user. The "only Module 2 writes" rule (STA-32) is enforced by
# GRANT, not by convention — that way a mistake in code fails loudly at the
# database instead of silently writing.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/statsdb}
spring.datasource.username=${POSTGRES_RO_USER:stats_ro}
spring.datasource.password=${POSTGRES_RO_PASSWORD:stats_ro}

# Keycloak — ADR-006 is ACCEPTED. Q8b was answered on 18 Aug 2026 by building the
# realm: docs/setup/keycloak-realm-statsapp.json. ZC's confirmation (Q8b-2) is
# still outstanding, which is exactly why every value below is a property.
#
# These properties are deliberately given NO defaults. Confirming them is a config
# change, not a code change — and an unset value stops the module starting rather
# than starting with a guessed security posture. Fail closed, always:
#   - no `tenant` claim      -> 403. It never means "all tenants".
#   - empty `tenant` claim   -> 403.
#   - no stats.readOnly role -> 403.
#   - caller-supplied tenant -> ignored; the claim always wins.
# Dev: http://localhost:8080/realms/statsapp. Production: the real HTTPS issuer.
# This is matched against the token's `iss` claim as a STRING — Spring does not
# fetch it when a jwk-set-uri is supplied. That is what lets one issuer value be
# correct whether the module runs on your machine or inside compose; a
# containerised module gets SPRING_SECURITY_..._JWK_SET_URI pointed at
# keycloak:8080 instead. Leave that unset everywhere else and discovery is used.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER}
# Audience — Boot's own property, so the decoder rejects a token minted for another
# client before anything in this module runs (401). A neighbouring service's token
# replayed against this API fails here (ADR-006). No default: unset stops the context —
# and so does EMPTY (STATS_API_AUDIENCE= in an .env). Boot binds an empty value to an empty
# list and then validates no audience at all; ResourceServerSettings refuses it at startup
# (DL-172). The issuer gets the same check.
spring.security.oauth2.resourceserver.jwt.audiences=${STATS_API_AUDIENCE}
# The realm role every read requires, and the claim the tenant is read from — the only
# source of tenant this module has (STA-34A). Bound by SecurityProperties since T-038/
# T-039 (DL-162); still the Q8b-2 values awaiting ZC's confirmation, which is why they are
# properties and why neither has a default in code. The read role is `stats.readOnly` —
# not the bare `readOnly` placeholder that was once in circulation.
stats.security.read-role=${STATS_READ_ONLY_ROLE}
stats.security.tenant-claim=${STATS_TENANT_CLAIM}
# Local Compose explicitly enables anonymous metrics scraping. Outside that
# configuration metrics require a bearer token, as before. No other route is opened.
stats.security.prometheus-public-access=false

# Pagination — deterministic sort is mandatory, not caller-selectable. Without an
# explicit (ts_device DESC, uid DESC) sort a paginated query can return the same
# row twice or skip one entirely. (CLAUDE.md §6) Bound by ApiProperties (DL-162), which
# has no defaults in code: every value below is required.
stats.api.default-page-size=100
# The contract's ceiling is 1000; configuration may lower it, never raise it.
stats.api.max-page-size=1000
# D12 — the widest `to - from` on the TENANT-WIDE list only. PROVISIONAL in the contract
# (openapi.yaml, ProblemQueryWindowExceeded) pending consumer confirmation and load
# testing. The device-scoped paths have no window: the covering index bounds them (DL-151).
stats.api.max-query-window=PT1H
# Continuation tokens are HMAC-SHA256 signed (T-042). The key is a SECRET, at least 32
# bytes, identical on every replica — a load balancer moving a walk between replicas with
# different keys ends it in invalid_cursor. No default: an unsigned or guessable cursor
# is exactly what the signature exists to prevent.
stats.api.cursor.signing-key=${STATS_API_CURSOR_SIGNING_KEY}
# How long an issued cursor stays valid. A device's whole retained window is ~13 pages at
# limit=1000; a quarter of an hour walks it many times over.
stats.api.cursor.ttl=PT15M

# stats_ro cannot write, and PostgreSQL enforces that (DL-135). Marking the pool's
# connections read-only as well costs nothing and names the intent at the driver.
spring.datasource.hikari.read-only=true

# Every read is bounded by the server (DL-168). The measured statements take
# milliseconds, but nothing stopped a runaway one from holding a pooled connection for as
# long as PostgreSQL let it. A cancelled statement (SQLSTATE 57014) translates to a
# transient data-access failure, which ApiExceptionHandler answers 503: retryable, and no
# partial page. Set on the connection, so it reaches every statement this pool runs.
# Deliberately NOT set on the Writer: its pool also runs DETACH PARTITION ... CONCURRENTLY,
# which legitimately waits for readers, and an interrupted detach wedges retention
# (CLAUDE.md section 6).
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=10s

# Health — D13. Readiness probes only this module's real dependencies: PostgreSQL
# and Keycloak. NOT RabbitMQ — this module has no broker connection (Q3a).
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Liveness and readiness are SEPARATE GROUPS and must stay separate — D13, D-10.
#
# LIVENESS answers "should this process be restarted". It probes the process ONLY.
# Putting a dependency in here creates a restart loop that fixes nothing: the
# database blips, every replica is killed, and the replacements cannot reach it
# either. Boot's default is already `livenessState`; it is written out so the pair
# is visible and neither silently drifts.
#
# READINESS answers "should traffic be routed here", and probes exactly this
# module's REAL dependencies — no more, no less.
#
# WHY THIS IS EXPLICIT: Boot's DEFAULT readiness group is `readinessState` alone.
# Left unset, /actuator/health/readiness reports UP with every dependency DOWN,
# and docker-compose health-checks that exact endpoint. It fails OPEN and silently.
management.endpoint.health.group.liveness.include=livenessState
# The API reads PostgreSQL and validates tokens against Keycloak. It has NO broker
# connection by decision (Q3a, ADR-002 §11), so `rabbit` must never appear here —
# its absence is part of that decision, not an oversight.
#
# Keycloak is covered since T-038 (DL-162): the `keycloak` contributor probes the URL the
# token decoder fetches signing keys from — the JWK set when one is configured, else the
# issuer's discovery document. Without it readiness reported UP while every token failed
# validation. It is NOT in liveness: a Keycloak outage must not restart the API.
management.endpoint.health.group.readiness.include=readinessState,db,keycloak

logging.structured.format.console=ecs
# T-005: the same field vocabulary as Input and the Writer.
logging.structured.json.add.module=api

# D-12 (DL-167): no ltestats/netstats payload reaches a log at ANY level. At TRACE Spring
# MVC writes every response body it serialises -- lac/cid, interface addresses, unmapped
# members -- so the two processors that write bodies are pinned. A pin on the exact
# logger survives an operator raising its parent (logging.level.org.springframework.web
# =TRACE, the natural incident move); only naming these loggers overrides it, which is a
# deliberate act. LteNetstatsPayloadsAreNeverLoggedIntegrationTest proves both.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO
