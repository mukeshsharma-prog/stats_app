# Shared test configuration for stats-api. The same keys as application.properties,
# with test values — never the production placeholders, which stay unresolvable here
# only where a test sets them explicitly.
#
# The issuer is validated as a string against `iss` and never fetched: the JWK set URI is
# supplied per run by ApiIntegrationTest (a local key server, TestJwks), exactly as
# Compose points a containerised API at keycloak:8080.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://issuer.test/realms/statsapp
spring.security.oauth2.resourceserver.jwt.audiences=stats-api
stats.security.read-role=stats.readOnly
stats.security.tenant-claim=tenant
stats.api.cursor.signing-key=test-only-cursor-signing-key-0123456789abcdef
# This module never migrates; the tests apply the Writer's migrations as the owner.
spring.flyway.enabled=false
