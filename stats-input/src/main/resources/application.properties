# Module 1 — Input. See DEVELOPMENT.md §4.
# Every property names the STA-nn requirement it serves, where one applies.
# Secrets come from the environment, never from this file.
#
# Values marked TBC are left COMMENTED OUT on purpose. An unanswered question must
# fail closed (absent) rather than fail open (a plausible-looking guess).

spring.application.name=stats-input
server.port=8081

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Publisher confirms — STA-04A. A 2xx is returned only after the broker confirms.
# Without this, a broker failure in the confirm window loses the message AND
# Heimdal will not retry, because it saw a success. (CLAUDE.md §6)
spring.rabbitmq.publisher-confirm-type=correlated
stats.amqp.confirm-timeout-ms=5000

# Mandatory publish + a ReturnsCallback — ADR-002 §9. A publisher confirm tells you
# the BROKER accepted the message, not that any queue wanted it. With a missing
# binding (new type deployed before its queue, typo, half-applied topology change)
# the broker ACKs and drops the message: Input would return 200, Heimdal would
# never retry, and the record would be gone with everything reporting success.
# A returned message is a FAILED acceptance -> 503 + records_unroutable{type}.
spring.rabbitmq.template.mandatory=true

stats.exchange.name=app_stats_input

# Request limits — STA-06B. PENDING: exact values come with D-03 (inbound contract).
# stats.input.max-request-bytes=TBC
# stats.input.request-timeout-ms=TBC

# Inbound Heimdal authentication — Q8a answered 18 Aug 2026: DEFERRED BY DECISION.
# Build the validate/publish/confirm path now; auth is a config-selected filter, so
# ZC's eventual answer (Q8a-2) is a filter implementation plus a config change and
# never a rewrite of the endpoint.
#
# THIS PROPERTY HAS NO DEFAULT IN CODE, DELIBERATELY. A deployment that does not
# set it must fail to start — `none` has to be typed by a person. Two more guards
# go with it, and neither is optional:
#   1. mode=none logs a WARN on EVERY startup naming the endpoint unauthenticated.
#   2. A test asserts the app REFUSES TO START under the `prod` profile with
#      mode=none. That is the guard that actually stops it reaching production.
#
# RISK ACCEPTED AND RECORDED: until Q8a-2 closes, anything that can reach the Input
# port can write statistics. Acceptable on a local dev stack and nowhere else.
# Raise this again before any shared deployment. (ADR-006, 2B-ANSWERS §3)
stats.input.auth.mode=${STATS_INPUT_AUTH_MODE}
stats.input.auth.required-role=${STATS_INGEST_ROLE}

# mTLS — populated when Q8a-2 selects it.
# stats.input.auth.mtls.trusted-issuer-dn=
# stats.input.auth.mtls.allowed-subject-dn=

# OAuth2 client credentials — populated when Q8a-2 selects it.
# stats.input.auth.oauth2.issuer-uri=
# stats.input.auth.oauth2.audience=

# Health — D13. Liveness and readiness are separate; readiness probes only this
# module's real dependencies, which for Input means the broker and NOT the database.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Structured JSON to stdout, uid as correlation ID — D1.
logging.structured.format.console=ecs
