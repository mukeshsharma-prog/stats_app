# Module 1 — Input.
# Secrets come from the environment, never from this file.
#
# Values marked TBC are left COMMENTED OUT on purpose. An unanswered question must
# fail closed (absent) rather than fail open (a plausible-looking guess).

spring.application.name=stats-input
server.port=8081

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Publisher confirms. A 2xx is returned only after the broker confirms.
# Without this, a broker failure in the confirm window loses the message AND
# Heimdal will not retry, because it saw a success.
spring.rabbitmq.publisher-confirm-type=correlated
# Bound by AmqpPublisherProperties, which refuses to start on a
# zero or negative value. It is a bound on how long a Heimdal request may block, not
# a tuning knob: on expiry we do not know whether the record was published, so the
# answer is 503 and Heimdal resends. The duplicate that follows is absorbed by
# ON CONFLICT DO NOTHING; a 200 in the same situation is a lost record.
stats.amqp.confirm-timeout=5s

# Mandatory publish + a ReturnsCallback. A publisher confirm tells you
# the BROKER accepted the message, not that any queue wanted it. With a missing
# binding (new type deployed before its queue, typo, half-applied topology change)
# the broker ACKs and drops the message: Input would return 200, Heimdal would
# never retry, and the record would be gone with everything reporting success.
# A returned message is a FAILED acceptance -> 503 + records_unroutable{type}.
spring.rabbitmq.template.mandatory=true

# Bound and CHECKED against AmqpTopology.INPUT_EXCHANGE — the application refuses to
# start on any other value. Pointing Input at an exchange no Writer binds to
# would be accepted, broker-confirmed, and silently dropped: every component reporting
# success while the record ceases to exist. The name is owned by stats-common, and
# this property exists so the deployment can SEE it, not choose it.
# Renamed from stats.exchange.name, which nothing read.
stats.amqp.exchange=app_stats_input

# The inbound HTTP surface — heimdal-input-contract-v1.md §1 and §2. ALL THREE VALUES
# ARE DRAFT until ZC confirms them: the contract records the paths as "confirm against the
# deployed Datahub API convention" and the success code as "200 or 202, exact code
# pending". They are externalised so ZC's answer is a property change rather than a
# code change. success-status is constrained in code to the two the contract admits,
# so a deployment cannot start returning 204 — "accepted", with no body and no agreed
# meaning to Heimdal.
#
# TWO DOORS, ONE BEHAVIOUR (21 Sep 2026). Management asked for one endpoint for
# internal callers (Heimdal Core) and one for external callers. Both run the same gate,
# publisher, confirm-then-2xx rule, size/rate bounds and authentication filter; the
# ingress routes and restricts them separately, and every Input metric and log line
# carries source=internal|external so the two can be told apart. The paths must differ,
# and neither may sit under /actuator (the readiness probe would inherit the filters).
# What the split does NOT do: it is not a second authentication mechanism, and it does
# not bind a record's tenant to the caller, so anything that can reach the external path
# can write under any tenant's name. Keep it off shared networks until that check exists.
stats.input.endpoint.internal-path=/internal/stats
stats.input.endpoint.external-path=/external/stats
stats.input.endpoint.success-status=200

# Validation scope. Input validates the ENVELOPE ONLY and 400s
# on failure. It does NOT validate the per-type payload: that is the
# Writer's gate, and a payload failure there is a dead-letter. The asymmetry is the
# whole point — Heimdal retries only on a non-2xx, so a 400 issued for a payload
# disagreement DESTROYS the record, while a dead-letter is redrivable. Production
# sends lorastats in three incompatible dialects today, so this is not hypothetical.
# In code: StatsSchemaValidator.validateEnvelope(), never .validate().
#
# ENFORCED. InputValidationProperties binds this key and the
# application REFUSES TO START on any other value, so widening the gate cannot happen
# by a quiet edit — it has to be an argued change to a class that says why.
stats.input.validation.intended-scope=envelope

# ts.converter is on 100% of production records and is accepted, preserved and never
# read (an early rule rejected it, which rejected every record). Metered so we can see
# if Heimdal ever stops sending it; read it from Timestamps.converter() being non-null.
# The metric NAME is not configuration. It lives in code as
# IngestMetrics.CONVERTER_TS_PRESENT, and this key was a second copy of it that
# nothing read — two spellings of one truth, free to drift (removed 8 Sep 2026).
# A dashboard or alert refers to the emitted name, not to this file.

# Clock skew, decided 29 Aug 2026. A record whose ts.device runs
# more than this ahead of ts.server is rejected with 400 and the field-level code
# clock_skew_exceeded, metered as records_clock_skew_rejected{type}. Anything inside
# the tolerance is accepted: a few seconds of NTP drift is normal and must not be an
# outage. The check compares two fields, which JSON Schema cannot express, so it lives
# here and not in envelope-v1.schema.json. Externalised, never hard-coded.
stats.input.validation.max-clock-skew=PT5M

# ts.server against REAL time, 13 Oct 2026. The skew check compares the record's two
# clocks with each other; nothing compared ts.server with now. A record whose ts.server
# (and so ts.device) runs further ahead of this instance's clock than this is rejected
# with 400 server_clock_ahead, metered with the skew rejections. Before this check it was
# answered 200, found no partition beyond the Writer's pre-create horizon (SQLSTATE
# 23514) and was dead-lettered as permanent. Keep this well inside the Writer's
# stats.retention.pre-create-days (7 days): the point is to refuse a broken clock, not
# to second-guess a few seconds of NTP drift between Heimdal and us.
stats.input.validation.max-server-clock-ahead=PT1H

# Request limits. ZC has NOT fixed these numbers: these values are
# ENGINEERING DEFAULTS, chosen so the endpoint is bounded today, and they are here
# rather than in code so ZC's answer is a property change. They are not a guess at
# what ZC will say — an unbounded ingest endpoint is wrong at every value ZC could
# choose, so waiting was never the safe option.
#
# max-request-bytes: the largest production record in the 29 Aug sample is under 4 KB;
# 256 KB is ~64x headroom and still refuses a body that could only be an error or an
# attack. Enforced on Content-Length, and on the stream when the request is chunked.
# Exceeded -> 413 payload_too_large + requests_too_large.
stats.input.limits.max-request-bytes=256KB

# max-requests-per-second: the PER-INSTANCE ingest rate limit, and the only
# replay control we actually own — Heimdal has agreed the 2x cap (2,667/s) and an
# agreement is a commitment, not a control. Sized against the ANSWERED steady state of
# ~1,333/s across five types with headroom for the jitter that answer
# describes; the cluster ceiling is this value times the replica count, which is the
# number to reason about when sizing. Exceeded -> 429 too_many_requests + Retry-After.
stats.input.limits.max-requests-per-second=4000
# Sized WITH Tomcat's request threads (server.tomcat.threads.max, default 200): every
# request holds a thread for its publisher-confirm wait, and the burst load test measured that wait at
# ~50 ms p99 under load -- 4,000 x 0.05 s = 200 concurrent. Raise this without raising the
# threads and requests queue in front of a confirm that is perfectly healthy
# (docs/runbooks/load-test-burst.md).

# The read timeout is the container's, not ours — a stalled TCP connection is not a
# thing application code can observe. Tomcat closes a connection whose request has not
# arrived in this long, which is what stops a slow-loris holding a worker thread.
server.tomcat.connection-timeout=10s

# Inbound Heimdal authentication: none | oauth2 | mtls. Heimdal's mechanism has not
# been agreed with ZC, so auth is a config-selected filter on both ingest paths, and
# ZC's answer is a configuration change, never a rewrite of the endpoint.
#
#   none    no authentication — local development only (see below)
#   oauth2  a Keycloak bearer token: signature, issuer, audience and expiry checked,
#           and the realm role required-role required. 401 without a valid token,
#           403 without the role, 503 while the signing keys cannot be fetched.
#   mtls    not implemented; selecting it refuses to start
#
# THE MODE HAS NO DEFAULT IN CODE, DELIBERATELY. A deployment that does not
# set it must fail to start — `none` has to be typed by a person. Two more guards
# go with it, and neither is optional:
#   1. mode=none logs a WARN on EVERY startup naming the endpoint unauthenticated.
#   2. A test asserts the app REFUSES TO START under the `prod` profile with
#      mode=none. That is the guard that actually stops it reaching production.
#
# RISK ACCEPTED AND RECORDED: in mode=none, anything that can reach the Input
# port can write statistics. Acceptable on a local dev stack and nowhere else.
# Raise this again before any shared deployment.
stats.input.auth.mode=${STATS_INPUT_AUTH_MODE}
stats.input.auth.required-role=${STATS_INGEST_ROLE}

# mode=oauth2. Read only in that mode, and then each must be set and non-blank or the
# application refuses to start — so the empty fallbacks below cannot reach a request.
# issuer-uri is compared with the token's `iss` as a string. jwk-set-uri, when set, is
# where the signing keys are fetched instead of OIDC discovery from the issuer: needed
# inside the compose network, where the issuer's localhost URL is not this container's.
# Leave it empty in production. audience is the client id the token must carry in `aud`.
stats.input.auth.oauth2.issuer-uri=${STATS_INPUT_OAUTH2_ISSUER_URI:}
stats.input.auth.oauth2.audience=${STATS_INPUT_OAUTH2_AUDIENCE:}
stats.input.auth.oauth2.jwk-set-uri=${STATS_INPUT_OAUTH2_JWK_SET_URI:}

# mTLS — populated if ZC selects it.
# stats.input.auth.mtls.trusted-issuer-dn=
# stats.input.auth.mtls.allowed-subject-dn=

# Health. Liveness and readiness are separate; readiness probes only this
# module's real dependencies, which for Input means the broker and NOT the database.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Liveness and readiness are SEPARATE GROUPS and must stay separate.
#
# LIVENESS answers "should this process be restarted". It probes the process ONLY.
# Putting a dependency in here creates a restart loop that fixes nothing: the
# database blips, every replica is killed, and the replacements cannot reach it
# either. Boot's default is already `livenessState`; it is written out so the pair
# is visible and neither silently drifts.
#
# READINESS answers "should traffic be routed here", and probes exactly this
# module's REAL dependencies — no more, no less.
#
# WHY THIS IS EXPLICIT: Boot's DEFAULT readiness group is `readinessState` alone.
# Left unset, /actuator/health/readiness reports UP with every dependency DOWN,
# and docker-compose health-checks that exact endpoint. It fails OPEN and silently.
management.endpoint.health.group.liveness.include=livenessState
# Input's real dependency is the BROKER and nothing else. It holds no database
# dependency at all, so there is no `db` indicator to include and
# adding one would be a rule violation, not a thoroughness win.
management.endpoint.health.group.readiness.include=readinessState,rabbit

# Structured JSON to stdout, uid as correlation ID.
logging.structured.format.console=ecs
# Every application log carries the same stable module field. Record-level
# fields are supplied by the scoped ingest MDC and each application statement owns
# its bounded event name.
logging.structured.json.add.module=input
