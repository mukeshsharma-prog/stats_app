<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stats Input - Service status</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #20334b; background: #f2f5f9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(640px, calc(100% - 40px)); margin: 32px 0; padding: 40px; background: white; border: 1px solid #dce4ef; border-radius: 16px; }
    .label { color: #53708e; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 18px 0 12px; font-size: clamp(26px, 5vw, 34px); line-height: 1.25; }
    p { color: #53647b; line-height: 1.65; }
    .port { padding: 14px 18px; background: #edf4fb; border-radius: 8px; color: #205381; }
    strong { color: #205381; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin: 26px 0; }
    a { padding: 10px 14px; border: 1px solid #bdcfe2; border-radius: 7px; color: #205381; text-decoration: none; }
    a:hover { background: #edf4fb; }
    a:focus-visible { outline: 3px solid #537faf; outline-offset: 3px; }
    .note { font-size: 14px; margin-bottom: 0; }
    @media (max-width: 480px) { main { padding: 26px; } }
  </style>
</head>
<body>
  <main>
    <div class="label">Stats App / Stats Input</div>
    <h1>Stats Input service is running</h1>
    <p class="port">Available on port <strong id="port">8081</strong>.</p>
    <p>Accepts statistics records and forwards them to RabbitMQ.</p>
    <nav aria-label="Service checks">
      <a href="actuator/health/readiness">Readiness</a>
      <a href="actuator/health/liveness">Liveness</a>
      <a href="actuator/prometheus">Metrics</a>
    </nav>
    <p class="note">This page confirms the HTTP service is responding. Open Readiness to check whether its dependencies are available.</p>
  </main>
  <script>
    document.getElementById("port").textContent = window.location.port || (window.location.protocol === "https:" ? "443" : "80");
  </script>
</body>
</html>
