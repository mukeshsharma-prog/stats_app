# Module 2 — Stats Writer. See DEVELOPMENT.md §4.
# Values marked TBC are left COMMENTED OUT on purpose — see the note in
# stats-input/src/main/resources/application.properties.

spring.application.name=stats-writer
server.port=8082

# Which stat type THIS instance consumes — ADR-003 D8. One image, but one
# deployment per stat type, because per-type concurrency, prefetch and replica
# count are a MUST (STA-11A/20A/26A) and are only independently tunable if the
# instances are separate. It also stops one type's crash loop halting the other
# four. `all` is a DEVELOPMENT convenience so a single container serves the local
# stack; production sets exactly one type per deployment.
stats.writer.stat-type=${STAT_TYPE:all}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/statsdb}
spring.datasource.username=${POSTGRES_USER:stats}
spring.datasource.password=${POSTGRES_PASSWORD:stats}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ACK only after the PostgreSQL transaction commits — D7, STA-25A.
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Migrations are versioned. Flyway — ADR-003 D6, final since Q1a closed 18 Aug 2026.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Retention — STA-23A/STA-23B. Default 90 days, overridable per type.
# Keys on ts.device, NOT ts.processor. See the caveat below.
stats.retention.default-days=90
# stats.retention.lorastats-days=90
# stats.retention.sysstats-days=30

# Partitioning is the retention mechanism — ADR-003. Retention detaches and drops
# one partition per type per day; it does not delete rows. At 115.2m records/day an
# unbounded DELETE means table bloat, long transactions and lock contention.
stats.retention.partition-granularity=daily
stats.retention.pre-create-days=7
stats.retention.schedule=0 30 3 * * *
# Fallback path only, if partitioning is not approved for increment 1.
stats.retention.delete-batch-size=10000
stats.retention.fallback-schedule=0 */5 * * * *
stats.retention.max-batches-per-run=50
stats.retention.max-run-duration=PT2M

# Retry tiers and DLQ — rule 5, G1/G4. Three tiers, all delays and the maximum
# attempt count externalised here and NEVER hard-coded. Immediate requeue is never
# used for a persistent failure — that is a hot loop against a failing database.
# Exhausted retries land in app_statsstore.<type>.dlq.
stats.amqp.retry.tier1-delay=PT30S
stats.amqp.retry.tier2-delay=PT5M
stats.amqp.retry.tier3-delay=PT30M
stats.amqp.max-retries=3
# stats.amqp.dlq-retention-ms=TBC   # still needs an operations decision (STA-12A)

# Per-type consumer controls — STA-11A. Prefetch starts at 500 (Q13a answered
# 18 Aug 2026): above the 100-500 micro-batch band so a batch can always be
# filled, low enough that one consumer cannot monopolise a synchronised burst.
# Tune against measurement, not against this comment.
stats.consumer.lorastats.concurrency=1
stats.consumer.lorastats.prefetch=500

# Writes — G3/D11. Individual inserts FIRST, behind a batch-shaped interface, so
# micro-batching becomes a tuning change against a real benchmark, not a rewrite.
stats.writer.batch.enabled=false
stats.writer.batch.max-records=100
stats.writer.batch.max-wait=PT0.05S

# Health — D13. Readiness probes this module's real dependencies: PostgreSQL and
# the broker.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

logging.structured.format.console=ecs

# RETENTION CAVEAT (STA-23B): retention keys on ts.device — the device's own
# timestamp, not the time we processed it. A gateway offline for three weeks
# delivers records already 21 days into their 90-day window. This is the answered
# and ACCEPTED business rule. Do not "correct" it to ts.processor. Cover it with a
# late-arrival boundary test. Late-arrival policy itself is BLOCKED on D5b.
