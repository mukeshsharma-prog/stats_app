# Module 2 — Stats Writer.
# Values marked TBC are left COMMENTED OUT on purpose — see the note in
# stats-input/src/main/resources/application.properties.

spring.application.name=stats-writer
server.port=8082

# Which stat type THIS instance consumes. One image, but one deployment per stat
# type, because per-type concurrency, prefetch and replica count must be
# independently tunable, and they are only that if the instances are separate. It
# also stops one type's crash loop halting the other four. `all` is a DEVELOPMENT
# convenience so a single container serves the local stack; production sets exactly
# one type per deployment, and StatTypeDeploymentGuard refuses `all` under `prod`.
stats.writer.stat-type=${STAT_TYPE:all}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/statsdb}
spring.datasource.username=${POSTGRES_USER:stats}
spring.datasource.password=${POSTGRES_PASSWORD:stats}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ACK only after the PostgreSQL transaction commits.
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Publisher confirms on the WRITER too. The Writer publishes only one thing: the
# retry or dead-letter copy of a delivery it could not persist. That copy must be
# CONFIRMED before the original is ACKed, or a crash in the gap loses the record with
# the broker, the database and Heimdal all reporting success. mandatory is set for
# the same reason it is at Input: a missing retry or DLQ queue would otherwise be
# ACKed by the broker and dropped.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.template.mandatory=true
stats.amqp.confirm-timeout=5s
# When that confirm does NOT arrive (a missing retry/DLQ queue, a broker refusing
# publishes under a resource alarm) the original is returned to its main queue after
# this pause and records_handoff_unconfirmed{type} moves. Rethrowing instead would
# leave the delivery unacknowledged on an open channel: never redelivered, one
# prefetch slot gone for good, and after `prefetch` of them a consumer that receives
# nothing. Never zero: the cause usually persists, and an immediate requeue would be
# a hot loop.
stats.amqp.unconfirmed-handoff-requeue-delay=PT5S

# Retry tiers. THREE explicit tiers, never a backoff multiplier, and every value
# externalised. Immediate requeue is never used for a persistent failure: it is a
# hot loop against a database that is already failing and it spends the whole
# attempt budget in milliseconds.
#
# One attempt per tier, so max-retries is 3 and a fourth failure retires the record to
# app_statsstore.<type>.dlq. Total time in the retry arm before the DLQ: 35m 30s.
stats.amqp.retry.tier1-delay=PT30S
stats.amqp.retry.tier2-delay=PT5M
stats.amqp.retry.tier3-delay=PT30M
stats.amqp.max-retries=3
# There is deliberately NO dlq TTL property, and no code that could read one. The DLQ
# never expires anything — see the DLQ alerting note below.

# Validation scope. THIS module owns the per-type payload gate:
# StatsSchemaValidator.validate(). A payload failure here is a DEAD-LETTER, never a
# 400 — the record was accepted, publisher-confirmed and published, so the caller is
# long gone. Never move this check into Input; that converts a redrivable mismatch
# into unrecoverable loss, because Heimdal only retries on a non-2xx.
#
# DELIBERATELY NOT CONFIGURABLE. There is no key here and no code that could read one:
# a scope switch would make "every payload reaches the INSERT unvalidated" a one-line
# configuration change, and there is no second scope for it to select. The gate is
# PayloadGate, its failure channel is PermanentFailureException, and a payload failure
# therefore SKIPS all three retry tiers — nothing about a schema mismatch becomes true
# by waiting 35½ minutes.

# DLQ alerting. Alert on depth > 0 and on prolonged nonempty duration; the DLQ itself
# never expires anything.
#
# One threshold fits every type. All three known lorastats dialects are accepted and
# normalised to one typed row, so nothing dead-letters routinely and what reaches a
# DLQ is real. The dialect enumeration is CLOSED AT THREE: an unknown fourth dialect
# dead-letters (docs/schemas/fixtures/invalid/lorastats-dialect-unknown.json), and a
# DLQ spike is never resolved by widening the schema to make it stop.
#
# THERE IS DELIBERATELY NO KEY HERE. A threshold property that nothing reads looks
# live, gets edited by someone expecting an effect, and silently does nothing — which
# is worse than an absent one, because the absent one gets noticed.
#
# Prometheus reads the existing per-type depth gauge and evaluates the immediate,
# 7-day warning and 12-day critical rules in ops/prometheus/dlq-alerts.yml. Grafana
# consumes those alerts. The Writer does not inspect or requeue DLQ messages for
# monitoring, and there is no application property that pretends to configure an
# external alert evaluator.

# Migrations are versioned, with Flyway.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Retention. Default 90 days, overridable per type.
# Keys on ts.device, NOT ts.server. See the caveat below.
#
# RetentionProperties binds it, and there is deliberately NO default in code:
# retention DELETES data, so a deployment that omits this key must fail to start
# rather than adopt a window somebody guessed. 90 days is the decided value and it is
# written here, where an operator can read it, not in a constant where they cannot.
stats.retention.default-days=90
#
# Per-type overrides. `days-by-type` is validated against StatType.wireName() at
# startup, so `days-by-type.lorstats=30` fails the context instead of quietly keeping
# that type for 90 days. A flat key per type would bind to nothing when mistyped and
# report nothing, and a retention window that silently reverted to the default is
# exactly the failure this file must not allow.
#
# Commented out because no type has yet been given a different window -- an override
# that merely restates the default is a line someone later edits believing it is the
# only place the value lives.
# stats.retention.days-by-type.sysstats=30

# Stagger between stat types in one maintenance run, so the five types do not fire
# together. The offset is derived from the TYPE, not from a position in a loop, so
# one mechanism covers both shapes: in production, where each type has its own
# deployment and all five fire on the same cron, it separates the deployments; in
# development `all` mode it separates the five passes inside one process. Set to PT0S
# to disable. Capped at PT10M by RetentionProperties -- the offset is taken by
# waiting, and a run that waits an hour is no longer an off-peak job.
stats.retention.stagger=PT30S

# Operational metrics. Broker depth and consumer counts are read on a
# schedule and CACHED; a Prometheus scrape reads the cache and performs no broker I/O.
# The initial delay lets the topology declare itself before the first passive inspection.
stats.metrics.poll-interval=PT30S
stats.metrics.initial-delay=PT30S
# Two scheduled jobs share this pool: the daily maintenance pass, which WAITS through
# each stat type's stagger slot (up to five slots of stats.retention.stagger in `all`
# mode), and the broker poll above. On Spring's default single thread the poll would
# stall behind the wait once a day and every gauge would go stale for the duration.
spring.task.scheduling.pool.size=2

# Partitioning is the retention mechanism. Retention detaches and drops one
# partition per type per day; it does not delete rows. At 115.2m records/day an
# unbounded DELETE means table bloat, long transactions and lock contention.
# DETACH PARTITION ... CONCURRENTLY, then DROP TABLE, on the same daily cron and
# behind the same advisory lock as pre-creation. Pre-creation runs FIRST in the pass
# -- tomorrow's partition exists before yesterday's is reclaimed.
# Pre-creation is a scheduled task in THIS module, behind the same
# pg_try_advisory_lock retention uses. pg_partman is never a dependency — the lock is
# needed regardless, because each stat type runs N Writer replicas.
stats.retention.partition-granularity=daily
# RetentionProperties rejects anything above 366 (MAX_PRE_CREATE_DAYS) to prevent
# accidental unbounded DDL — that bound is on the horizon below, not on the cron.
# Days AHEAD of today. Every pass also ensures every day BEHIND today back to the
# retention cutoff — the range is [cutoffDay, today + pre-create-days] — so a
# valid record from a gateway back after weeks offline always has a partition, on a
# deployment a minute old as much as a year old. That half is not configurable: a
# retained day without a partition dead-letters valid records as permanent.
stats.retention.pre-create-days=7
stats.retention.schedule=0 30 3 * * *
# Also pre-create at STARTUP, before the listener containers begin consuming. The
# cron above is not sufficient on its own: a module deployed at any other hour would
# come up against a parent table with no partitions and stay that way until 03:30,
# with every insert failing and -- under manual ACK -- every delivery correctly left
# unacknowledged until the consumer runs out of prefetch and wedges. Set to false
# ONLY where a separate job owns partition DDL, for example when the writer's
# database role is deliberately not permitted to issue it.
stats.retention.pre-create-on-startup=true
# There is no batched-DELETE fallback. Row-by-row deletion at this volume is the
# failure partitioning exists to avoid; a fallback would be a new decision, not a
# set of keys.

# Per-type consumer controls. Prefetch starts at 500: above the 100-500 micro-batch
# band so a batch can always be filled, low enough that one consumer cannot
# monopolise a synchronised burst. Tune against measurement, not against this comment.
stats.consumer.lorastats.concurrency=1
stats.consumer.lorastats.prefetch=500
# Stop accepting new deliveries, allow active processing to finish for this long, then
# close the channel so RabbitMQ requeues anything still unacknowledged. The surrounding
# process manager must allow more than this interval before sending SIGKILL.
stats.consumer.lorastats.shutdown-timeout=5s

# sysstats. Same starting values as lorastats: nothing has been measured that says
# the two differ, and a value copied without a measurement is a value to tune later,
# not a decision. One deployment per type is what makes these independently tunable
# at all.
stats.consumer.sysstats.concurrency=1
stats.consumer.sysstats.prefetch=500
stats.consumer.sysstats.shutdown-timeout=5s

# omsstats. Same starting values, for the same reason.
stats.consumer.omsstats.concurrency=1
stats.consumer.omsstats.prefetch=500
stats.consumer.omsstats.shutdown-timeout=5s

# Writes. Individual inserts FIRST, behind a batch-shaped interface, so
# micro-batching becomes a tuning change against a real benchmark, not a rewrite.
stats.writer.batch.enabled=false
stats.writer.batch.max-records=100
stats.writer.batch.max-wait=PT0.05S

# Health. Readiness probes this module's real dependencies: PostgreSQL and
# the broker.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Liveness and readiness are SEPARATE GROUPS and must stay separate.
#
# LIVENESS answers "should this process be restarted". It probes the process ONLY.
# Putting a dependency in here creates a restart loop that fixes nothing: the
# database blips, every replica is killed, and the replacements cannot reach it
# either. Boot's default is already `livenessState`; it is written out so the pair
# is visible and neither silently drifts.
#
# READINESS answers "should traffic be routed here", and probes exactly this
# module's REAL dependencies — no more, no less.
#
# WHY THIS IS EXPLICIT: Boot's DEFAULT readiness group is `readinessState` alone.
# Left unset, /actuator/health/readiness reports UP with every dependency DOWN,
# and docker-compose health-checks that exact endpoint. It fails OPEN and silently.
management.endpoint.health.group.liveness.include=livenessState
# The Writer needs BOTH: it consumes from RabbitMQ and commits to PostgreSQL, and
# it cannot do its job with either one gone. A Writer that reports ready without a
# database takes deliveries it must then fail to ACK.
management.endpoint.health.group.readiness.include=readinessState,db,rabbit

logging.structured.format.console=ecs
# Static module identity belongs in formatter configuration so lifecycle and
# record logs cannot disagree about it.
logging.structured.json.add.module=writer

# No ltestats/netstats payload reaches a log at ANY level, and no payload
# of any type reaches one through a framework. Spring JDBC prints every bound SQL
# parameter at TRACE -- the IMSI, lac/cid, interface addresses and unmapped members
# included -- so that one logger is pinned. A pin on the exact logger survives an
# operator raising its parent (logging.level.org.springframework.jdbc=TRACE, the
# natural incident move); only naming this logger itself overrides it, which is a
# deliberate act. LteNetstatsPayloadsAreNeverLoggedIntegrationTest proves both.
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=INFO

# RETENTION CAVEAT: retention keys on ts.device — the device's own
# timestamp, not the time we processed it. A gateway offline for three weeks
# delivers records already 21 days into their 90-day window. This is the answered
# and ACCEPTED business rule. Do not "correct" it to ts.server. Cover it with a
# late-arrival boundary test.
#
# The path is REAL, not hypothetical: ZC confirmed ts.device is device-assigned. The
# 29 Aug sample showed ts.device == ts.server on 14 of 15 records only because all
# fifteen came from healthy gateways.
#
# Late-arrival policy: RetentionGuard skips a record already past the window, meters
# records_expired_on_arrival{type}, logs at WARN and ACKs. Never dead-lettered — a
# redrive would repeat the verdict forever, because the record only gets older, in a
# queue that never expires. The guard and the sweep read ONE cutoff
# (RetentionWindow), so a record can never be admitted into a partition retention has
# just dropped.
#
# THE ALERT IS BUILT: ops/prometheus/writer-alerts.yml fires
# StatsAppLateArrival on any increase of records_expired_on_arrival in an hour. The same
# file carries the oldest-message-age rules on queue_oldest_message_age_seconds --
# sampled at delivery from the AMQP timestamp Input stamps, zeroed by the broker poll
# when the queue is empty -- with the two companion rules that cover its blind spot
# (no consumer; consumer stalled), and the upstream-status ratio rule whose threshold is
# PROVISIONAL until the first 24 h of ingest set it. As with the DLQ
# rules, there is deliberately no key here that pretends to configure Prometheus.

# LTE and network consumers: same isolated controls as the reference slice.
stats.consumer.ltestats.concurrency=1
stats.consumer.ltestats.prefetch=500
stats.consumer.ltestats.shutdown-timeout=5s
stats.consumer.netstats.concurrency=1
stats.consumer.netstats.prefetch=500
stats.consumer.netstats.shutdown-timeout=5s
