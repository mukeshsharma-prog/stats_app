# Module 2 — Stats Writer. See DEVELOPMENT.md §4.
# Values marked TBC are left COMMENTED OUT on purpose — see the note in
# stats-input/src/main/resources/application.properties.

spring.application.name=stats-writer
server.port=8082

# Which stat type THIS instance consumes — ADR-003 D8. One image, but one
# deployment per stat type, because per-type concurrency, prefetch and replica
# count are a MUST (STA-11A/20A/26A) and are only independently tunable if the
# instances are separate. It also stops one type's crash loop halting the other
# four. `all` is a DEVELOPMENT convenience so a single container serves the local
# stack; production sets exactly one type per deployment.
stats.writer.stat-type=${STAT_TYPE:all}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/statsdb}
spring.datasource.username=${POSTGRES_USER:stats}
spring.datasource.password=${POSTGRES_PASSWORD:stats}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# ACK only after the PostgreSQL transaction commits — D7, STA-25A.
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# Publisher confirms on the WRITER too — ADR-005, T-024. The Writer publishes only one
# thing: the retry or dead-letter copy of a delivery it could not persist. That copy
# must be CONFIRMED before the original is ACKed, or a crash in the gap loses the
# record with the broker, the database and Heimdal all reporting success. mandatory is
# set for the same reason it is at Input: a missing retry or DLQ queue would otherwise
# be ACKed by the broker and dropped (ADR-002 §9).
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.template.mandatory=true
stats.amqp.confirm-timeout=5s

# Retry tiers — G1/G4, 18 Aug 2026. THREE explicit tiers, never a backoff multiplier,
# and every value externalised. Immediate requeue is never used for a persistent
# failure: it is a hot loop against a database that is already failing and it spends
# the whole attempt budget in milliseconds.
#
# One attempt per tier, so max-retries is 3 and a fourth failure retires the record to
# app_statsstore.<type>.dlq. Total time in the retry arm before the DLQ: 35m 30s.
stats.amqp.retry.tier1-delay=PT30S
stats.amqp.retry.tier2-delay=PT5M
stats.amqp.retry.tier3-delay=PT30M
stats.amqp.max-retries=3
# There is deliberately NO dlq TTL property, and no code that could read one. The DLQ
# never expires anything (ADR-002 §12) — see the DLQ alerting note below.

# Validation scope — ADR-007 §5, DL-088. THIS module owns the per-type payload gate:
# StatsSchemaValidator.validate(). A payload failure here is a DEAD-LETTER, never a
# 400 — the record was accepted, publisher-confirmed and published, so the caller is
# long gone. Never move this check into Input; that converts a redrivable mismatch
# into unrecoverable loss (FLOW.md §8 window 12).
#
# LIVE SINCE T-057 (8 Sep 2026, DL-126), and DELIBERATELY NOT CONFIGURABLE. There is no
# key here and no code that could read one. The old `stats.writer.validation
# .intended-scope` recorded the decided design while the gate was unbuilt and was named
# "intended" so it could not be mistaken for a live control (DL-100); promoting it to a
# real switch would have made "every payload reaches the INSERT unvalidated" a one-line
# configuration change, and ADR-007 §5 offers no second scope for it to select. The gate
# is PayloadGate, its failure channel is PermanentFailureException, and a payload
# failure therefore SKIPS all three retry tiers — nothing about a schema mismatch
# becomes true by waiting 35½ minutes.

# DLQ alerting. Alert on depth > 0 and on prolonged nonempty duration; the DLQ itself
# never expires anything.
#
# The lorastats carve-out that used to live here is GONE. It existed because
# ADR-007 §4 encoded one of the three production dialects and dead-lettered the other
# two — on the order of 15m messages/day — so lorastats needed a threshold no other
# type could share. Q15a was answered on 4 Sep 2026 (DL-105): all three known dialects
# are ACCEPTED and normalised to one typed row, ADR-007 §4 is reversed, and the
# permanent lorastats backlog it was sizing for does not exist. A uniform threshold is
# correct again.
#
# STILL TRUE, and the reason DL-105 is not a licence: the enumeration is CLOSED AT
# THREE. An unknown fourth dialect dead-letters, and a DLQ spike is never resolved by
# widening the schema to make it stop. DL-105 widened it because ZC explained the
# dialects, not because the queue was full.
#
# LIVE SINCE T-063 (8 Sep 2026, DL-127): all three known dialects are accepted and
# normalised to one typed row, so the ~15m messages/day of routine dialect
# dead-lettering is gone and a uniform threshold is correct. What remains in this
# queue is real. docs/schemas/fixtures/invalid/lorastats-dialect-unknown.json is the
# fourth-dialect case, and it still dead-letters by design.
#
# THE QUEUES THEMSELVES ARE LIVE SINCE T-024 (DL-122): three retry tiers, a per-type
# DLQ and the app_stats_dlx bindings are declared and exercised.
#
# THERE IS DELIBERATELY NO KEY HERE, and that is a change of 8 Sep 2026.
# `stats.writer.dlq.alert-depth.default=0` used to sit on this line and NOTHING read
# it — no @ConfigurationProperties bound it, no code referenced it. It is the same
# hazard DL-100 named when it insisted the validation-scope key be called
# `intended-scope`: a key that looks live is one someone edits expecting an effect,
# and a threshold that silently does nothing is worse than an absent one, because the
# absent one gets noticed. The payload-gate key was deleted for exactly this reason on
# 8 Sep; leaving this one would have kept the inconsistency it was deleted to remove.
#
# Prometheus reads the existing per-type depth gauge and evaluates the immediate,
# 7-day warning and 12-day critical rules in ops/prometheus/dlq-alerts.yml. Grafana
# consumes those alerts. The Writer does not inspect or requeue DLQ messages for
# monitoring, and there is no application property that pretends to configure an
# external alert evaluator.

# Migrations are versioned. Flyway — ADR-003 D6, final since Q1a closed 18 Aug 2026.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Retention — STA-23A/STA-23B. Default 90 days, overridable per type.
# Keys on ts.device, NOT ts.server. See the caveat below.
#
# LIVE SINCE T-025 (10 Sep 2026, DL-132). It was parked until then per this file's own
# rule -- a value that is decided but unread must fail closed (absent) rather than fail
# open -- and RetentionProperties now binds it. There is deliberately NO default in
# code: retention DELETES data, so a deployment that omits this key must fail to start
# rather than adopt a window somebody guessed. 90 days is the decided value and it is
# written here, where an operator can read it, not in a constant where they cannot.
stats.retention.default-days=90
#
# Per-type overrides. The shape recorded before T-025 was `stats.retention.<type>-days`,
# one flat key per type; it never bound to anything and it is NOT what was built. A flat
# key that is mistyped binds to nothing and reports nothing, and a retention window that
# silently reverted to the default is precisely the failure DL-100, DL-129 and DL-130
# each found somewhere else in this file. `days-by-type` is validated against
# StatType.wireName() at startup, so `days-by-type.lorstats=30` fails the context
# instead of quietly keeping that type for 90 days.
#
# Commented out because no type has yet been given a different window -- an override
# that merely restates the default is a line someone later edits believing it is the
# only place the value lives.
# stats.retention.days-by-type.sysstats=30

# Stagger between stat types in one maintenance run -- ADR-003 D3, "stagger the five
# types rather than firing them together". The offset is derived from the TYPE, not
# from a position in a loop, so one mechanism covers both shapes: in production, where
# D8 gives each type its own deployment and all five fire on the same cron, it separates
# the deployments; in development `all` mode it separates the five passes inside one
# process. Set to PT0S to disable. Capped at PT10M by RetentionProperties -- the offset
# is taken by waiting, and a run that waits an hour is no longer the off-peak job D4
# describes.
stats.retention.stagger=PT30S

# Operational metrics -- T-027 (DL-137). Broker depth and consumer counts are read on a
# schedule and CACHED; a Prometheus scrape reads the cache and performs no broker I/O.
# The initial delay lets the topology declare itself before the first passive inspection.
stats.metrics.poll-interval=PT30S
stats.metrics.initial-delay=PT30S
# Two scheduled jobs share this pool: the daily maintenance pass, which WAITS through
# each stat type's stagger slot (up to five slots of stats.retention.stagger in `all`
# mode), and the broker poll above. On Spring's default single thread the poll would
# stall behind the wait once a day and every gauge would go stale for the duration.
spring.task.scheduling.pool.size=2

# Partitioning is the retention mechanism — ADR-003. Retention detaches and drops
# one partition per type per day; it does not delete rows. At 115.2m records/day an
# unbounded DELETE means table bloat, long transactions and lock contention.
# BUILT SINCE T-025 (10 Sep 2026, DL-132): DETACH PARTITION ... CONCURRENTLY, then
# DROP TABLE, on the same daily cron and behind the same advisory lock as pre-creation.
# Pre-creation runs FIRST in the pass -- tomorrow's partition exists before yesterday's
# is reclaimed.
# Pre-creation mechanism decided 29 Aug 2026 (ADR-003 D1): a scheduled task in THIS
# module, behind the same pg_try_advisory_lock retention uses. pg_partman is never a
# dependency — the lock is needed regardless, because D8 runs N replicas per stat type.
stats.retention.partition-granularity=daily
# RetentionProperties rejects anything above 366 (MAX_PRE_CREATE_DAYS) to prevent
# accidental unbounded DDL — that bound is on the horizon below, not on the cron.
stats.retention.pre-create-days=7
stats.retention.schedule=0 30 3 * * *
# Also pre-create at STARTUP, before the listener containers begin consuming. The
# cron above is not sufficient on its own: a module deployed at any other hour would
# come up against a parent table with no partitions and stay that way until 03:30,
# with every insert failing and -- under the T-020 manual-ACK contract -- every
# delivery correctly left unacknowledged until the consumer runs out of prefetch and
# wedges. Set to false ONLY where a separate job owns partition DDL, for example when
# the writer's database role is deliberately not permitted to issue it.
stats.retention.pre-create-on-startup=true
# The four batched-DELETE fallback keys are GONE — removed 8 Sep 2026 (DL-130).
# They configured the path to take "if partitioning is not approved for increment 1",
# and partitioning WAS approved: ADR-003 makes daily RANGE (ts_device) partitions with
# detach-and-drop the retention mechanism, and CLAUDE.md §6 lists row-by-row deletion at
# this volume as a trap. So these tuned a design the project decided against, read by no
# code, in a file where they still looked like live operational settings. If a fallback
# is ever genuinely needed it is a new decision, not four keys nobody removed.

# The four retry keys were DECLARED TWICE in this file, here and again above, with
# identical values — removed 8 Sep 2026. A .properties file silently keeps the LAST
# definition, so tuning tier1 at its first appearance changed nothing and the reason
# was invisible: both spellings were correct, both were committed, and the file loaded
# without a murmur. The single definition lives with the tier explanation above.

# Per-type consumer controls — STA-11A. Prefetch starts at 500 (Q13a answered
# 18 Aug 2026): above the 100-500 micro-batch band so a batch can always be
# filled, low enough that one consumer cannot monopolise a synchronised burst.
# Tune against measurement, not against this comment.
stats.consumer.lorastats.concurrency=1
stats.consumer.lorastats.prefetch=500
# Stop accepting new deliveries, allow active processing to finish for this long, then
# close the channel so RabbitMQ requeues anything still unacknowledged. The surrounding
# process manager must allow more than this interval before sending SIGKILL.
stats.consumer.lorastats.shutdown-timeout=5s

# Writes — G3/D11. Individual inserts FIRST, behind a batch-shaped interface, so
# micro-batching becomes a tuning change against a real benchmark, not a rewrite.
stats.writer.batch.enabled=false
stats.writer.batch.max-records=100
stats.writer.batch.max-wait=PT0.05S

# Health — D13. Readiness probes this module's real dependencies: PostgreSQL and
# the broker.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# Liveness and readiness are SEPARATE GROUPS and must stay separate — D13, D-10.
#
# LIVENESS answers "should this process be restarted". It probes the process ONLY.
# Putting a dependency in here creates a restart loop that fixes nothing: the
# database blips, every replica is killed, and the replacements cannot reach it
# either. Boot's default is already `livenessState`; it is written out so the pair
# is visible and neither silently drifts.
#
# READINESS answers "should traffic be routed here", and probes exactly this
# module's REAL dependencies — no more, no less.
#
# WHY THIS IS EXPLICIT: Boot's DEFAULT readiness group is `readinessState` alone.
# Left unset, /actuator/health/readiness reports UP with every dependency DOWN,
# and docker-compose health-checks that exact endpoint. It fails OPEN and silently.
management.endpoint.health.group.liveness.include=livenessState
# The Writer needs BOTH: it consumes from RabbitMQ and commits to PostgreSQL, and
# it cannot do its job with either one gone. A Writer that reports ready without a
# database takes deliveries it must then fail to ACK.
management.endpoint.health.group.readiness.include=readinessState,db,rabbit

logging.structured.format.console=ecs
# T-005: static module identity belongs in formatter configuration so lifecycle and
# record logs cannot disagree about it.
logging.structured.json.add.module=writer

# RETENTION CAVEAT (STA-23B): retention keys on ts.device — the device's own
# timestamp, not the time we processed it. A gateway offline for three weeks
# delivers records already 21 days into their 90-day window. This is the answered
# and ACCEPTED business rule. Do not "correct" it to ts.server. Cover it with a
# late-arrival boundary test.
#
# The path is REAL, not hypothetical: Q15b (DL-106, 4 Sep 2026) confirmed ts.device is
# genuinely device-assigned. The 29 Aug sample showed ts.device == ts.server on 14 of
# 15 records only because all fifteen came from healthy gateways.
#
# Late-arrival policy is SIGNED — D5b, DL-112, 4 Sep 2026 — and BUILT by T-026 on
# 10 Sep 2026 (DL-133): RetentionGuard skips the record, meters
# records_expired_on_arrival{type}, logs at WARN and ACKs. Never dead-lettered — a
# redrive would repeat the verdict forever, because the record only gets older, in a
# queue ADR-002 §12 forbids ever expiring. The guard and the sweep read ONE cutoff
# (RetentionWindow), so a record can never be admitted into a partition retention has
# just dropped.
#
# THE ALERT IS BUILT (T-050, DL-147): ops/prometheus/writer-alerts.yml fires
# StatsAppLateArrival on any increase of records_expired_on_arrival in an hour. The same
# file carries the oldest-message-age rules on queue_oldest_message_age_seconds --
# sampled at delivery from the AMQP timestamp Input stamps, zeroed by the broker poll
# when the queue is empty -- with the two companion rules that cover its blind spot
# (no consumer; consumer stalled), and the upstream-status ratio rule whose threshold is
# PROVISIONAL until the first 24 h of ingest set it (DL-128 residual). As with the DLQ
# rules, there is deliberately no key here that pretends to configure Prometheus.

